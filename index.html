<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maher Game Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14121F; --surface:#1E1B2E; --surfaceLight:#272341; --border:#332C52;
  --gold:#F2B705; --goldDark:#C9930A; --teal:#35D0BA; --text:#F5F3FF; --muted:#9B93B5; --danger:#E85D5D;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;padding-bottom:70px;}
.pixel{font-family:'Press Start 2P',monospace;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ===== AUTH GATE ===== */
.authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;}
.authBox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 24px;}
.authLogo{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:22px;}
.authTabs{display:flex;background:var(--surfaceLight);border-radius:10px;padding:4px;margin-bottom:20px;}
.authTab{flex:1;text-align:center;padding:9px 0;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);border:none;background:transparent;font-weight:600;}
.authTab.active{background:var(--gold);color:#1A1502;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.inputRow{display:flex;align-items:center;gap:8px;background:var(--surfaceLight);border:1px solid var(--border);border-radius:10px;padding:11px 13px;}
.inputRow input,.inputRow select{background:transparent;border:none;outline:none;color:var(--text);width:100%;font-size:14px;}
.authBtn{width:100%;background:var(--gold);color:#1A1502;border:none;border-radius:10px;padding:13px 0;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
.authNote{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;}
.authError{color:var(--danger);font-size:12px;margin-bottom:10px;}
.adminLink{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:none;width:100%;}

/* ===== HEADER ===== */
header{border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20;}
.headerRow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;max-width:1100px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:1px;}
.headerRight{display:flex;align-items:center;gap:10px;}
.iconBtn{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px;display:flex;color:var(--text);cursor:pointer;}
.badge{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#1A1502;font-size:10px;font-weight:700;border-radius:999px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
.userChip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-size:12px;}

/* ===== SLIDESHOW ===== */
.slideshow{position:relative;height:230px;overflow:hidden;border-radius:0;margin-bottom:6px;}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;opacity:0;transition:opacity .5s ease;padding:0 20px;}
.slide.active{opacity:1;}
.slideCat{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.85);margin-bottom:8px;}
.slideTitle{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px;}
.slidePrice{font-size:13px;color:#fff;opacity:.9;}
.slideDots{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:6px;justify-content:center;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);}
.dot.active{background:#fff;width:18px;border-radius:4px;}

/* ===== SECTIONS ===== */
.sectionTitle{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.searchBox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:18px 0 6px;}
.searchBox input{background:transparent;border:none;outline:none;color:var(--text);width:100%;font-size:14px;}
.chipsRow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.chip{padding:8px 14px;border-radius:999px;cursor:pointer;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--muted);}
.chip.active{border-color:var(--gold);background:rgba(242,183,5,0.12);color:var(--gold);}
.hScroll{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity;}
.hScroll .card{flex:0 0 200px;scroll-snap-align:start;}
.emptyMsg{color:var(--muted);font-size:14px;padding:20px 0;}

/* ===== CARD ===== */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.card::after{content:"";position:absolute;left:12px;right:12px;top:112px;height:0;border-top:2px dashed var(--border);}
.notch{position:absolute;top:106px;width:12px;height:12px;background:var(--bg);border-radius:50%;}
.notch.l{left:-6px;} .notch.r{right:-6px;}
.cover{height:112px;display:flex;align-items:center;justify-content:center;position:relative;background-size:cover;background-position:center;}
.cover svg{opacity:.9;}
.favBtn{position:absolute;top:8px;right:8px;background:rgba(20,18,31,.6);border:none;border-radius:8px;padding:6px;cursor:pointer;display:flex;color:#fff;}
.favBtn.active{color:var(--gold);}
.cardBody{padding:20px 14px 14px;}
.cardMeta{font-size:10px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between;}
.cardTitle{font-size:14px;font-weight:700;margin:0 0 4px;}
.cardDesc{font-size:11px;color:var(--muted);margin:0 0 12px;line-height:1.4;min-height:28px;}
.cardFoot{display:flex;align-items:center;justify-content:space-between;}
.price{font-size:12px;font-weight:700;}
.price.free{color:var(--teal);} .price.paid{color:var(--gold);}
.actionBtn{display:flex;align-items:center;gap:5px;border:none;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;}
.btnGold{background:var(--gold);color:#1A1502;}
.btnTeal{background:var(--teal);color:#08221D;}
.btnGhostGold{background:transparent;color:var(--gold);border:1px solid var(--gold);}
.btnGhostTeal{background:transparent;color:var(--teal);border:1px solid var(--teal);}

/* ===== VIEW PAGES ===== */
.pageHead{padding:26px 20px 4px;}
.pageHead h2{font-size:18px;margin:0 0 6px;}
.pageHead p{color:var(--muted);font-size:13px;margin:0;}
.libGrid{padding:16px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;max-width:1100px;margin:0 auto;}
.helpCard{margin:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;gap:14px;align-items:center;}
.helpCard .txt div:first-child{font-weight:700;font-size:14px;margin-bottom:3px;}
.helpCard .txt div:last-child{color:var(--muted);font-size:12px;}
.waIcon{background:rgba(53,208,186,.15);color:var(--teal);border-radius:12px;padding:12px;display:flex;flex-shrink:0;}
.waBtn{margin-left:auto;background:var(--teal);color:#08221D;text-decoration:none;font-size:12px;font-weight:700;padding:9px 14px;border-radius:8px;}
.socialGrid{display:flex;gap:12px;padding:0 20px;flex-wrap:wrap;}
.socialIcon{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;}
.adCard{margin:12px 20px;background:linear-gradient(135deg,var(--surfaceLight),var(--surface));border:1px dashed var(--border);border-radius:14px;padding:20px;text-align:center;color:var(--muted);font-size:13px;}
.adCard b{color:var(--gold);display:block;font-size:14px;margin-bottom:4px;}

/* ===== BOTTOM NAV ===== */
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:30;}
.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:10px;}
.navBtn.active{color:var(--gold);}

/* ===== DRAWER (cart) ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:49;display:none;}
.overlay.show{display:block;}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:50;transform:translateX(100%);transition:transform .25s ease-out;}
.drawer.show{transform:translateX(0);}
.drawerHead{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.closeBtn{background:none;border:none;color:var(--muted);cursor:pointer;}
.cartList{flex:1;overflow-y:auto;padding:16px;}
.cartItem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.cartThumb{width:44px;height:44px;border-radius:8px;flex-shrink:0;background-size:cover;background-position:center;}
.cartInfo{flex:1;}
.cartInfo .t{font-size:14px;font-weight:600;}
.cartInfo .p{font-size:12px;color:var(--gold);}
.rmBtn{background:none;border:none;color:var(--danger);cursor:pointer;}
.cartFoot{padding:20px;border-top:1px solid var(--border);}
.cartFoot .row{display:flex;justify-content:space-between;margin-bottom:14px;}
.fullBtn{width:100%;background:var(--gold);color:#1A1502;border:none;border-radius:10px;padding:13px 0;font-weight:700;font-size:14px;cursor:pointer;}
.payPane{padding:20px;display:flex;flex-direction:column;gap:14px;}
.payPane input{background:var(--surfaceLight);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;}
.backBtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;}
.donePane{padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-top:30px;}
.doneIcon{width:56px;height:56px;border-radius:50%;background:rgba(53,208,186,0.15);display:flex;align-items:center;justify-content:center;}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surfaceLight);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.toast.show{opacity:1;}

/* ===== ADMIN ===== */
.adminWrap{max-width:900px;margin:0 auto;padding:20px;}
.adminHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.adminTabs{display:flex;gap:8px;margin-bottom:20px;}
.adminTab{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;}
.adminTab.active{background:var(--gold);color:#1A1502;border-color:var(--gold);}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;}
.formGrid .full{grid-column:1/-1;}
.formGrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.formGrid input,.formGrid select,.formGrid textarea{width:100%;background:var(--surfaceLight);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;}
.formGrid textarea{resize:vertical;min-height:60px;}
.checkRow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
.imgPreview{width:100%;height:100px;border-radius:10px;background:var(--surfaceLight);display:flex;align-items:center;justify-content:center;overflow:hidden;background-size:cover;background-position:center;margin-top:8px;}
.adminGamesList{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
.adminGameRow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
.adminThumb{width:44px;height:44px;border-radius:8px;flex-shrink:0;background-size:cover;background-position:center;}
.adminGameRow .info{flex:1;min-width:0;}
.adminGameRow .info .t{font-size:13px;font-weight:700;}
.adminGameRow .info .m{font-size:11px;color:var(--muted);}
.trendBadge{font-size:10px;background:rgba(242,183,5,.15);color:var(--gold);padding:3px 8px;border-radius:999px;}
.rowBtn{background:var(--surfaceLight);border:1px solid var(--border);border-radius:8px;padding:7px;cursor:pointer;color:var(--text);}
.rowBtn.danger{color:var(--danger);}
.settingsPanel{display:flex;flex-direction:column;gap:16px;}
.settingsCard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;}
.settingsCard h3{margin:0 0 6px;font-size:15px;}
.settingsCard p{margin:0 0 14px;color:var(--muted);font-size:12px;}
.settingsRows{display:flex;flex-direction:column;gap:10px;}
.settingsRow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;}
.settingsRow input,.settingsRow textarea{width:100%;background:var(--surfaceLight);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;}
.settingsRow label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
.settingsActions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
@media(max-width:600px){.settingsRow{grid-template-columns:1fr;}.adminTabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.adminTab{white-space:nowrap;}}


/* ===== NAV / MOBILE FIXES ===== */
body{padding-bottom:88px;overflow-x:hidden;}
#viewContent{min-height:calc(100vh - 150px);}
.bottomNav{height:72px;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(0,0,0,.18);}
.navBtn{min-width:0;position:relative;z-index:31;}
.navBtn span{white-space:nowrap;}
@media(max-width:520px){
  .headerRow{padding:12px 14px;}
  .wrap{padding:0 14px;}
  .pageHead{padding:22px 14px 4px;}
  .libGrid{padding:14px 14px 36px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .hScroll{gap:10px;}
  .hScroll .card{flex-basis:180px;}
  .cardBody{padding:18px 11px 12px;}
  .bottomNav{height:68px;}
  .navBtn{padding:8px 0 6px;font-size:9px;}
}
@media(max-width:420px){
  .libGrid{grid-template-columns:1fr;}
  .headerRight{gap:5px;}
  .userChip{max-width:100px;overflow:hidden;text-overflow:ellipsis;}
}
.formGrid .imageField{display:flex;flex-direction:column;}
.imagePicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.imagePicker input[type=file]{padding:8px;background:var(--surfaceLight);border:1px solid var(--border);border-radius:10px;color:var(--muted);}
.emuPreview{height:90px;}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== ICONS ===================== */
const ICONS = {
  Zap:'<path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>',
  Ghost:'<path d="M9 10h.01M15 10h.01M5 21V11a7 7 0 0114 0v10l-2-2-2 2-2-2-2 2-2-2-2 2z"/>',

  Store:'<path d="M3 9l1-5h16l1 5M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',
  Music:'<path d="M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm12-2a3 3 0 11-6 0 3 3 0 016 0z"/>',
  Swords:'<path d="M14 4l6 6-9 9-3-3 9-9zM4 20l4-1 1-4M17 3l4 1-1 4"/>',
  Trophy:'<path d="M8 21h8M12 17v4M17 4H7v6a5 5 0 0010 0V4z"/><path d="M5 4H3v2a4 4 0 004 4M19 4h2v2a4 4 0 01-4 4"/>',
  Crosshair:'<circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  Download:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/>',
  Check:'<path d="M20 6L9 17l-5-5"/>',
  Plus:'<path d="M12 5v14M5 12h14"/>',
  Trash:'<path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/>',
  Search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
  Cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>',
  Home:'<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/>',
  Bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>',
  LifeBuoy:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="M4.9 4.9l4.2 4.2M14.9 14.9l4.2 4.2M14.9 9.1l4.2-4.2M4.9 19.1l4.2-4.2"/>',
  Share2:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  LogOut:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  User:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  Lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
  Phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.4 2.1L8.1 9.7a16 16 0 006.2 6.2l1.2-1.2a2 2 0 012.1-.4c.9.3 1.8.5 2.7.6a2 2 0 011.7 2z"/>',
  Flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',
  Upload:'<path d="M12 21V9m0 0l-4 4m4-4l4 4"/><path d="M4 21h16"/>',
  Edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  MessageCircle:'<path d="M21 11.5a8.38 8.38 0 01-8.5 8.4H12a8.5 8.5 0 01-4-1L3 21l1.5-4.5A8.4 8.4 0 013 12.5 8.5 8.5 0 0111.5 4h.5a8.4 8.4 0 018 7z"/>',
  Heart:'<path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/>',
  Instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/>',
  Facebook:'<path d="M15 8h3V4h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V9a1 1 0 011-1z"/>',
  X:'<path d="M4 4l16 16M20 4L4 20"/>',
  Gamepad:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/>'
};
function icon(name,size=18,color="currentColor",cls=""){
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;

function showToast(msg){
  const t=document.getElementById("toast");

function bindAuth(){
  document.querySelectorAll(".authTab").forEach(b=>b.addEventListener("click",()=>{authTab=b.dataset.tab;authError="";render();}));
  document.getElementById("goAdminLogin").addEventListener("click",()=>{view="admin-login";render();});
  const loginBtn=document.getElementById("loginBtn");
  if(loginBtn) loginBtn.addEventListener("click",()=>{
    const u=document.getElementById("loginUser").value.trim();
    const p=document.getElementById("loginPass").value;
    const found=users.find(x=>x.username===u && x.password===p);
    if(!found){authError = users.find(x=>x.username===u) ? "Password si sahihi." : "Akaunti haipo, tafadhali jisajili."; render(); return;}
    currentUser=found; authError=""; view="home"; render();
  });
  const signupBtn=document.getElementById("signupBtn");
  if(signupBtn) signupBtn.addEventListener("click",()=>{
    const u=document.getElementById("suUser").value.trim();
    const phone=document.getElementById("suPhone").value.trim();
    const country=document.getElementById("suCountry").value.trim();
    const p=document.getElementById("suPass").value;
    if(!u||!phone||!country||!p){authError="Jaza taarifa zote.";render();return;}
    if(users.find(x=>x.username===u)){authError="Jina hili tayari linatumika.";render();return;}
    const nu={username:u,phone,country,password:p,joinedAt:new Date().toISOString()};
    users.push(nu);
    if(window.MAHER){const z=MAHER.get();z.users=users;MAHER.save(z);}
    currentUser=nu; authError=""; view="home"; render();
  });
}

function gameCardHtml(g){
  const fav = myFavs().includes(g.id);
  const inCart = cart.some(i=>i.id===g.id);
  const dl = downloading[g.id];
  let action;
  if(g.price===0){
    if(dl==="imekamilika") action=`<button class="actionBtn btnGhostTeal" disabled>${icon("Check",13)}Tayari</button>`;
    else if(dl==="inapakua") action=`<button class="actionBtn btnTeal" disabled>Inapakua...</button>`;
    else action=`<button class="actionBtn btnTeal" data-dl="${g.id}">${icon("Download",13)}Pakua</button>`;
  } else {
    action = inCart ? `<button class="actionBtn btnGhostGold" disabled>${icon("Check",13)}Ipo</button>`
      : `<button class="actionBtn btnGold" data-add="${g.id}">${icon("Plus",13)}Ongeza</button>`;
  }
  return `
    <div class="card">
      <button class="favBtn ${fav?'active':''}" data-fav="${g.id}">${icon("Heart",16,fav?"var(--gold)":"#fff")}</button>
      <div class="notch l"></div><div class="notch r"></div>
      <div class="cover" style="${coverStyle(g)}">${g.image?'':icon(g.icon,34,"#fff")}</div>
      <div class="cardBody">
        <div class="cardMeta"><span>${g.category.toUpperCase()}</span><span>${g.platform}</span></div>
        <h3 class="cardTitle">${g.title}</h3>
        <p class="cardDesc">${g.desc}</p>
        <div class="cardFoot"><span class="price mono ${g.price===0?'free':'paid'}">${money(g.price)}</span>${action}</div>
      </div>
    </div>`;
}
function filteredGames(){
  return games.filter(g=>
    (activeCategory==="Zote"||g.category===activeCategory) &&
    g.title.toLowerCase().includes(searchQuery.toLowerCase())
  );
}
function renderGameRows(){
  const list=filteredGames();
  document.getElementById("freeRow").innerHTML = renderRow(list.filter(g=>g.price===0));
  document.getElementById("paidRow").innerHTML = renderRow(list.filter(g=>g.price>0));
  document.getElementById("allRow").innerHTML = renderRow(list);
  bindCardEvents();
}
function renderRow(list){
  if(!list.length) return `<div class="emptyMsg">Hakuna games hapa kwa sasa.</div>`;
  return list.map(gameCardHtml).join("");
}
function bindCardEvents(){
  document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{
    const g=games.find(x=>x.id===Number(b.dataset.add));
    if(cart.some(i=>i.id===g.id)){showToast(`${g.title} tayari ipo kwenye kikapu`);return;}
    cart.push(g); showToast(`${g.title} imeongezwa kwenye kikapu`);
    renderGameRows(); updateCartCount();
  }));
  document.querySelectorAll("[data-dl]").forEach(b=>b.addEventListener("click",()=>{
    const g=games.find(x=>x.id===Number(b.dataset.dl));
    downloading[g.id]="inapakua"; renderGameRows();
    setTimeout(()=>{downloading[g.id]="imekamilika";if(window.maherRecordDownload)maherRecordDownload(g);showToast(`${g.title} imepakuliwa!`);renderGameRows();},1400);
  }));
  document.querySelectorAll("[data-fav]").forEach(b=>b.addEventListener("click",()=>{
    if(!currentUser){showToast("Ingia kwanza kutumia Library");return;}
    toggleFav(Number(b.dataset.fav)); if(window.maherRecordFavorite)maherRecordFavorite(Number(b.dataset.fav),myFavs().includes(Number(b.dataset.fav))); renderGameRows();
    if(view==="library") renderViewContent();
  }));
}
function startSlideshow(){
  clearInterval(slideTimer);
  const slides=document.querySelectorAll("#slideshow .slide");
  const dots=document.querySelectorAll("#slideshow .dot");
  if(!slides.length) return;
  slideIndex=0;
  slideTimer=setInterval(()=>{
    slides[slideIndex].classList.remove("active"); dots[slideIndex].classList.remove("active");
    slideIndex=(slideIndex+1)%slides.length;
    slides[slideIndex].classList.add("active"); dots[slideIndex].classList.add("active");
  },2500);
  const box=document.getElementById("slideshow");
  box.addEventListener("mouseenter",()=>clearInterval(slideTimer));
  box.addEventListener("mouseleave",startSlideshow);
}

const overlay=()=>document.getElementById("overlay");
const drawer=()=>document.getElementById("drawer");

function updateCartCount(){
  const el=document.getElementById("cartCount");
  if(!el) return;
  el.textContent=cart.length; el.style.display=cart.length?"flex":"none";
}
function renderCartDrawer(){
  const pane=document.getElementById("cartPane");
  if(!pane) return;
  const total=cart.reduce((s,i)=>s+i.price,0);
  if(checkoutStep==="cart"){
    pane.innerHTML=`
      <div class="cartList">
        ${cart.length===0?`<p class="emptyMsg">Kikapu chako kipo tupu.</p>`:cart.map(item=>`
          <div class="cartItem">
            <div class="cartThumb" style="${coverStyle(item)}"></div>
            <div class="cartInfo"><div class="t">${item.title}</div><div class="p mono">${money(item.price)}</div></div>
            <button class="rmBtn" data-rm="${item.id}">${icon("Trash",16)}</button>
          </div>`).join("")}
      </div>
      ${cart.length>0?`<div class="cartFoot"><div class="row"><span style="color:var(--muted);font-size:14px;">Jumla</span><span class="mono" style="font-weight:700;color:var(--gold);">${money(total)}</span></div><button class="fullBtn" id="payBtn">Lipa kwa M-Pesa</button></div>`:""}`;
    pane.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{cart=cart.filter(i=>i.id!==Number(b.dataset.rm));renderCartDrawer();renderGameRows&&document.getElementById("freeRow")&&renderGameRows();updateCartCount();}));
    const payBtn=document.getElementById("payBtn");
    if(payBtn) payBtn.addEventListener("click",()=>{checkoutStep="pay";renderCartDrawer();});
  } else if(checkoutStep==="pay"){
    pane.innerHTML=`
      <div class="payPane">
        <p style="font-size:14px;color:var(--muted);">Weka namba yako ya M-Pesa kuthibitisha malipo ya <span class="mono" style="color:var(--gold);">${money(total)}</span>.</p>
        <input id="phoneInput" class="mono" placeholder="07xx xxx xxx" value="${phoneVal}">
        <button class="fullBtn" id="confirmPayBtn">Thibitisha Malipo</button>
        <button class="backBtn" id="backBtn">Rudi nyuma</button>
      </div>`;
    document.getElementById("phoneInput").addEventListener("input",e=>phoneVal=e.target.value);
    document.getElementById("confirmPayBtn").addEventListener("click",()=>{
      if(phoneVal.trim().length<9){showToast("Weka namba sahihi ya simu");return;}
      orderNo="MCH-"+Math.floor(100000+Math.random()*900000);
      checkoutStep="done"; renderCartDrawer();
    });
    document.getElementById("backBtn").addEventListener("click",()=>{checkoutStep="cart";renderCartDrawer();});
  } else if(checkoutStep==="done"){
    pane.innerHTML=`
      <div class="donePane">
        <div class="doneIcon">${icon("Check",28,"var(--teal)")}</div>
        <h3 style="font-size:17px;font-weight:700;">Malipo Yamefanikiwa</h3>
        <p style="color:var(--muted);font-size:14px;">Namba ya oda: <span class="mono" style="color:var(--gold);">${orderNo}</span></p>
        <p style="color:var(--muted);font-size:13px;">Link za kupakua zimetumwa kwa simu ${phoneVal}.</p>
        <button class="fullBtn" style="width:auto;padding:12px 24px;" id="doneBtn">Sawa, Funga</button>
      </div>`;
    document.getElementById("doneBtn").addEventListener("click",()=>{cart=[];updateCartCount();closeDrawer();});
  }
}

      </div>

        <button class="fullBtn" id="saveGameBtn" style="flex:1;">${editingGameId?'Hifadhi Mabadiliko':'Hifadhi Game'}</button>
        ${editingGameId?`<button class="fullBtn" id="cancelEditBtn" style="flex:1;background:var(--surfaceLight);color:var(--text);">Ghairi</button>`:""}
      </div>

}
function bindAdminForm(){
  const emuFileInput=document.getElementById("fEmuImage");
  if(emuFileInput) emuFileInput.addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      pendingEmuImage=ev.target.result;
      const prev=document.getElementById("emuImgPreview");
      if(prev){prev.style.backgroundImage=`url(${pendingEmuImage})`;prev.innerHTML="";}
    };
    reader.readAsDataURL(file);
  });
  const fileInput=document.getElementById("fImage");
  fileInput.addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      pendingImage=ev.target.result;
      document.getElementById("imgPreview").style.backgroundImage=`url(${pendingImage})`;
      document.getElementById("imgPreview").innerHTML="";
    };
    reader.readAsDataURL(file);
  });
  document.getElementById("saveGameBtn").addEventListener("click",()=>{
    const title=document.getElementById("fTitle").value.trim();
    const desc=document.getElementById("fDesc").value.trim();
    const link=document.getElementById("fLink")?.value.trim()||"";
    const emulator=document.getElementById("fEmu")?.value==="yes";
    const emulatorName=document.getElementById("fEmuName")?.value.trim()||"";
    const emulatorLink=document.getElementById("fEmuLink")?.value.trim()||"";
    const price=Number(document.getElementById("fPrice").value)||0;
    const platform=document.getElementById("fPlatform").value;
    const category=document.getElementById("fCategory").value;
    const trending=document.getElementById("fTrend").checked;
    if(!title){showToast("Weka jina la game");return;}
    if(trending && games.filter(g=>g.trending && g.id!==editingGameId).length>=6){
      showToast("Umefikia kikomo cha games 6 kwenye Trending. Ondoa mojawapo kwanza.");return;
    }
    if(editingGameId){
      const g=games.find(x=>x.id===editingGameId);
      Object.assign(g,{title,desc,price,platform,category,trending,image:pendingImage||g.image,link,emulator,emulatorName,emulatorImage:pendingEmuImage!==null?pendingEmuImage:(g.emulatorImage||null),emulatorLink});
      showToast("Mabadiliko yamehifadhiwa");
    } else {
      games.push({id:nextGameId++,title,desc,price,platform,category,trending,image:pendingImage,link,emulator,emulatorName,emulatorImage:pendingEmuImage,emulatorLink,icon:"Zap",grad:"linear-gradient(135deg,#5B3CC4,#241755)"});
      showToast("Game imeongezwa");
    }
    editingGameId=null; pendingImage=null; adminTab="list"; renderAdminContent();
  });
  const cancelBtn=document.getElementById("cancelEditBtn");
  if(cancelBtn) cancelBtn.addEventListener("click",()=>{editingGameId=null;pendingImage=null;pendingEmuImage=null;adminTab="list";renderAdminContent();});
}
function adminListTemplate(){
  return `<div class="adminGamesList">${games.map(g=>`
    <div class="adminGameRow">
      <div class="adminThumb" style="${coverStyle(g)}"></div>
      <div class="info"><div class="t">${g.title}</div><div class="m">${g.category} · ${g.platform} · ${money(g.price)}</div></div>
      ${g.trending?`<span class="trendBadge">Trending</span>`:""}
      <button class="rowBtn" data-edit="${g.id}">${icon("Edit",15)}</button>
      <button class="rowBtn danger" data-del="${g.id}">${icon("Trash",15)}</button>
    </div>`).join("")}</div>`;
}
function bindAdminList(){
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
    editingGameId=Number(b.dataset.edit); pendingImage=null; adminTab="add"; renderAdminContent();
  }));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    const g=games.find(x=>x.id===Number(b.dataset.del));
    if(confirm(`Una uhakika unataka kufuta "${g.title}"?`)){
      games=games.filter(x=>x.id!==g.id);
      const store=window.MAHER?MAHER.get():null;
      if(store){store.games=games;MAHER.save(store);}
      renderAdminContent();
    }
  }));
}

render();

<script>
/* MAHER GAME STORE — shared control layer */
(function(){
 const KEY='maher_game_store_v3';
 const base={users:[],games:null,downloads:[],favorites:{},visits:[],orders:[],settings:{payments:[],help:[],ads:[],social:{tiktok:'',whatsapp:''}}};
 function get(){let x;try{x=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){x=null}if(!x)x=structuredClone(base);for(const k in base)if(x[k]===undefined)x[k]=structuredClone(base[k]);if(!x.games)x.games=window.games||[];return x}
 function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
 window.MAHER={KEY,get,save};
 let st=get();
 if(!st.games || !st.games.length)st.games=window.games||[];
 // Keep existing demo users/data while migrating to the shared store.
 if((window.users||[]).length && !st.users.length)st.users=window.users;
 save(st);
 window.games=st.games; window.users=st.users;
 // Daily unique website views per browser session.
 const today=new Date().toISOString().slice(0,10), sid=sessionStorage.getItem('maher_sid')||Math.random().toString(36).slice(2);
 sessionStorage.setItem('maher_sid',sid);
 st=get(); if(!st.visits.some(v=>v.date===today&&v.sid===sid)){st.visits.push({date:today,sid,time:new Date().toISOString()});save(st)}
 // Reload shared games whenever website is rendered.
 const oldRender=window.render;
 window.render=function(){const z=get();window.games=z.games||[];window.users=z.users||[];if(oldRender)oldRender()};
 // Add registration timestamp to every new account.
 const oldBindAuth=window.bindAuth;
 if(oldBindAuth){
   // Keep original UI binding, but capture newly created user through users array after action.
   window.bindAuth=function(){oldBindAuth();};
 }
 // Shared helpers for admin / website.
 window.maherSaveUser=function(u){let z=get();const i=z.users.findIndex(x=>x.username===u.username);if(i>=0)z.users[i]=u;else z.users.push(u);save(z);window.users=z.users};
 window.maherRecordDownload=function(g){let z=get();z.downloads.push({gameId:g.id,username:window.currentUser?.username||'guest',free:g.price===0,date:new Date().toISOString()});save(z)};
 window.maherRecordFavorite=function(id,active){let z=get(),u=window.currentUser?.username||'guest';z.favorites[u]=z.favorites[u]||[];const a=z.favorites[u],i=a.indexOf(id);if(active&&i<0)a.push(id);if(!active&&i>=0)a.splice(i,1);save(z)};
})();
</script>
<script>
/* Maher checkout/payment + admin-controlled content */
(function(){
 function st(){return MAHER.get()}; function sv(x){MAHER.save(x)}
 window.renderCartDrawer=function(){
  const pane=document.getElementById('cartPane'); if(!pane)return; const z=st(), total=cart.reduce((a,g)=>a+Number(g.price||0),0);
  if(checkoutStep==='cart'){
   pane.innerHTML=`<div class="cartList">${cart.length?cart.map(g=>`<div class="cartItem"><div class="cartThumb" style="${coverStyle(g)}"></div><div class="cartInfo"><div class="t">${g.title}</div><div class="p mono">${money(g.price)}</div></div><button class="rmBtn" data-rm="${g.id}">${icon('Trash',16)}</button></div>`).join(''):'<p class="emptyMsg">Kikapu chako kipo tupu.</p>'}</div>${cart.length?`<div class="cartFoot"><div class="row"><span style="color:var(--muted);font-size:14px">Jumla</span><span class="mono" style="font-weight:700;color:var(--gold)">${money(total)}</span></div><button class="fullBtn" id="payBtn">Lipa na Pakua</button></div>`:''}`;
   pane.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cart=cart.filter(g=>g.id!==Number(b.dataset.rm));renderCartDrawer();updateCartCount()});
   document.getElementById('payBtn')?.addEventListener('click',()=>{checkoutStep='pay';renderCartDrawer()});
  } else if(checkoutStep==='pay'){
   const ps=z.settings.payments||[];
   pane.innerHTML=`<div class="payPane"><p style="color:var(--muted);font-size:13px">Lipa <b style="color:var(--gold)">${money(total)}</b> kupitia namba hizi:</p>${ps.length?ps.map(p=>`<div style="padding:10px;background:var(--surfaceLight);border:1px solid var(--border);border-radius:10px;margin:7px 0"><b>${p.network}</b><div class="mono" style="color:var(--gold);margin-top:4px">${p.number}</div></div>`).join(''):'<div class="adCard">Admin hajaweka namba ya malipo bado.</div>'}<input id="phoneInput" class="mono" placeholder="Namba uliyotumia kulipia"><input id="trxInput" class="mono" placeholder="Transaction ID / reference"><button class="fullBtn" id="confirmPayBtn">Tuma Ombi la Malipo</button><button class="backBtn" id="backBtn">Rudi nyuma</button></div>`;
   document.getElementById('confirmPayBtn')?.addEventListener('click',()=>{const phone=document.getElementById('phoneInput').value.trim(),trx=document.getElementById('trxInput').value.trim();if(phone.length<9){showToast('Weka namba sahihi');return}const no='MGS-'+Math.floor(100000+Math.random()*900000);z.orders.push({orderNo:no,username:currentUser?.username||'guest',phone,transactionId:trx,games:cart.map(g=>({id:g.id,title:g.title,price:g.price,link:g.link||''})),total,status:'pending',createdAt:new Date().toISOString()});sv(z);orderNo=no;phoneVal=phone;checkoutStep='done';renderCartDrawer()});
   document.getElementById('backBtn')?.addEventListener('click',()=>{checkoutStep='cart';renderCartDrawer()});
  } else {
   const o=z.orders.find(x=>x.orderNo===orderNo), ok=o&&o.status==='paid';
   pane.innerHTML=`<div class="donePane"><div class="doneIcon">${icon(ok?'Check':'Clock',28,ok?'var(--teal)':'var(--gold)')}</div><h3>${ok?'Malipo Yameidhinishwa':'Ombi la Malipo Limetumwa'}</h3><p style="color:var(--muted);font-size:13px">Oda: <span class="mono" style="color:var(--gold)">${orderNo}</span></p><p style="color:var(--muted);font-size:13px">${ok?'Pakua games zako hapa chini.':'Subiri admin athibitishe malipo yako.'}</p>${ok?(o.games||[]).map(g=>`<a class="fullBtn" style="display:block;text-align:center;text-decoration:none;margin:7px 0" href="${g.link||'#'}" target="_blank" onclick="if(window.maherRecordDownload){const gg=MAHER.get().games.find(x=>x.id==${g.id});if(gg)maherRecordDownload(gg)}">Pakua ${g.title}</a>`).join(''):''}<button class="fullBtn" id="doneBtn">Funga</button></div>`;
   document.getElementById('doneBtn').onclick=()=>{cart=[];updateCartCount();closeDrawer()};
  }
 };
 // Replace the old fixed payment label if present.
 const oldRender=window.renderViewContent;
 if(oldRender)window.renderViewContent=function(){oldRender()};
 // When website loads, use admin-managed games/settings.
 window.addEventListener('storage',()=>{const z=st();window.games=z.games||[];render()});
})();
</script>
