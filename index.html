<main class="max-w-6xl mx-auto px-4 py-6" id="app"></main>

<footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-600">
  © <span id="year"></span> MaherGamingStore — Msaada wa AI: ALTAImaher robot 🤖

<!-- chat widget -->
<button id="chat-toggle" class="fixed bottom-5 right-5 z-[90] w-14 h-14 rounded-full bg-gradient-to-br from-amber-400 to-violet-500 shadow-lg shadow-amber-500/30 flex items-center justify-center text-slate-950 text-xl">💬</button>

  <div class="bg-gradient-to-r from-amber-500/20 to-violet-500/20 px-4 py-3 border-b border-slate-800 flex items-center gap-2">

<div id="modal-root"></div>

<script>
/* ================= shared data layer (Firebase Realtime Database — free) =================
   HII NDIYO SEHEMU MUHIMU: badilisha DB_URL hapa chini na URL ya database yako ya Firebase.
   Lazima uweke DB_URL ile ile HAPA na kwenye faili ya dashboard, ili zisome/ziandike
   sehemu moja ya data. Fuata maelekezo niliyokupa ili kuipata. */
const DB_URL = "https://mahergamingstore-default-rtdb.firebaseio.com";

const K = { users:"mgs/users", games:"mgs/games", ads:"mgs/ads", payments:"mgs/payments",
  tournaments:"mgs/tournaments", settings:"mgs/settings", stats:"mgs/stats", claims:"mgs/coinclaims" };

function withTimeout(promise, ms){
  return new Promise((resolve) => {
    let done = false;
    const timer = setTimeout(() => { if(!done){ done = true; resolve(null); } }, ms);
    Promise.resolve(promise).then((v) => { if(!done){ done = true; clearTimeout(timer); resolve(v); } })
      .catch(() => { if(!done){ done = true; clearTimeout(timer); resolve(null); } });
  });
}
const STORAGE_OK = !DB_URL.includes("PROJECT-ID");
async function getJSON(key, fallback){
  if(!STORAGE_OK) return fallback;
  try{
    const res = await withTimeout(fetch(`${DB_URL}/${key}.json`), 20000);
    if(!res) return fallback;
    const data = await res.json();
    return (data === null || data === undefined) ? fallback : data;
  }catch{ return fallback; }
}
async function setJSON(key, value){
  if(!STORAGE_OK) return false;
  try{
    const res = await withTimeout(fetch(`${DB_URL}/${key}.json`, { method:"PUT", body: JSON.stringify(value) }), 20000);
    return !!res && res.ok;
  }catch(e){ console.error("storage set failed", e); return false; }
}
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const esc = (s) => (s || "").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function genCode(){ const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)]; return c; }

const GENRES = ["Action","Sport","Adventure","FPS Shooter","Simulator (Car & Racing)","Tactical Shooter"];
const GENRE_ICON = { "Action":"💥","Sport":"⚽","Adventure":"🗺️","FPS Shooter":"🔫","Simulator (Car & Racing)":"🏎️","Tactical Shooter":"🎯" };

/* ================= state ================= */
let state = {
  user: null, tab: "home", storeFilter: "Zote", genreFilter: "Zote", searchQuery: "",
  games: [], ads: [], tournaments: [], settings: {}, payments: [], claims: [],
  modal: null,
};

document.getElementById("year").textContent = new Date().getFullYear();

async function refreshAll(){
  const [g,a,t,s,p,c] = await Promise.all([
    getJSON(K.games, []), getJSON(K.ads, []), getJSON(K.tournaments, []),
    getJSON(K.settings, {}), getJSON(K.payments, []), getJSON(K.claims, []),
  ]);
  state.games=g; state.ads=a; state.tournaments=t; state.settings=s; state.payments=p; state.claims=c;
}

async function bumpVisit(){
  const stats = await getJSON(K.stats, { visits:0, dailyDownloads:{}, downloadsLog:[] });
  stats.visits = (stats.visits||0) + 1;
  await setJSON(K.stats, stats);
}

async function logDownload(game, type){
  const stats = await getJSON(K.stats, { visits:0, dailyDownloads:{}, downloadsLog:[] });
  const today = new Date().toISOString().slice(0,10);
  stats.dailyDownloads[today] = (stats.dailyDownloads[today]||0) + 1;
  stats.downloadsLog = [...(stats.downloadsLog||[]), { gameId:game.id, gameTitle:game.title, userPhone:state.user.phone, type, date:Date.now() }];
  await setJSON(K.stats, stats);
}

/* ================= focus-preserving render wrapper ================= */
function withFocusPreserved(fn){
  const active = document.activeElement;
  const id = active && active.id;
  const tag = active && active.tagName;
  let selStart, selEnd;
  if(id && (tag === "INPUT" || tag === "TEXTAREA")){
    selStart = active.selectionStart; selEnd = active.selectionEnd;
  }
  fn();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if((tag === "INPUT" || tag === "TEXTAREA") && typeof selStart === "number" && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ================= badges / atoms ================= */
function badge(text, tone){
  const tones = { amber:"bg-amber-400/10 text-amber-300 border-amber-400/30", violet:"bg-violet-400/10 text-violet-300 border-violet-400/30",
    amber:"bg-amber-400/10 text-amber-300 border-amber-400/30", rose:"bg-rose-400/10 text-rose-300 border-rose-400/30" };
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border ${tones[tone]}">${text}</span>`;
}

/* ================= header ================= */
function renderHeader(){
  const el = document.getElementById("header-auth");
  if(state.user){
    el.innerHTML = `
      <div class="hidden sm:flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-full px-3 py-1 text-xs font-bold text-amber-300">🪙 ${state.user.coins||0}</div>
      <span class="hidden sm:block text-xs text-slate-400">Habari, ${esc(state.user.username)}</span>
      <button data-action="logout" class="text-slate-400 hover:text-rose-400 text-lg">⏻</button>`;
  } else {
    el.innerHTML = `<button data-action="open-auth" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3 py-2 rounded-lg">Ingia / Jisajili</button>`;
  }
}

function renderNav(){
  const tabs = [["home","🏠 Home"],["store","🛒 Duka"],["ads","📣 Matangazo"],["tournament","🏆 Tournament"]];
  document.getElementById("nav-tabs").innerHTML = tabs.map(([key,label]) => `
    <button data-tab="${key}" class="chip px-3 py-1.5 rounded-full whitespace-nowrap ${state.tab===key ? "bg-gradient-to-r from-amber-500 to-violet-500 text-slate-950" : "text-slate-400 hover:text-slate-200 bg-slate-900/60"}">${label}</button>`).join("");
}

/* ================= game card ================= */
function myPaymentsFor(){ return state.payments.filter(p => state.user && p.userPhone===state.user.phone); }

function gameCard(g){
  const myPay = myPaymentsFor();
  const cashApproved = myPay.some(p=>p.type==="game" && p.targetId===g.id && p.status==="approved");
  const cashPending = myPay.some(p=>p.type==="game" && p.targetId===g.id && p.status==="pending");
  const coinReq = myPay.find(p=>p.type==="coin" && p.targetId===g.id);
  const coinApproved = coinReq && coinReq.status==="approved";
  const isFree = g.category === "Bure";
  const unlocked = isFree || cashApproved || coinApproved;

  const downloadLinks = [
    { kind:"apk", label:"APK", url:g.linkApk, color:"bg-rose-500 hover:bg-rose-400" },
    { kind:"obb", label:"OBB", url:g.linkObb, color:"bg-emerald-500 hover:bg-emerald-400" },
    { kind:"data", label:"Data", url:g.linkData, color:"bg-blue-500 hover:bg-blue-400" },
  ].filter(d => d.url);

  let actions = "";
  if(unlocked){
    if(state.user){
      /* real <a> tags = genuine link clicks, exactly like the Emulator link — this is what
         makes them open reliably (a JS-triggered window.open() can get silently blocked). */
      actions = downloadLinks.length > 0
        ? `<div class="mt-3 flex flex-col gap-1.5">${downloadLinks.map(d => `<a href="${d.url}" target="_blank" rel="noreferrer" data-action="download-log" data-id="${g.id}" data-kind="${d.kind}" class="w-full flex items-center justify-center gap-2 ${d.color} text-slate-950 text-xs font-bold py-2 rounded-lg">⬇ ${d.label}</a>`).join("")}</div>`
        : `<p class="mt-3 text-[11px] text-slate-500 text-center">Link ya download bado haijawekwa na admin.</p>`;
    } else {
      actions = `<button data-action="download" data-id="${g.id}" class="mt-3 w-full flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold py-2 rounded-lg">⬇ Download</button>`;
    }
  } else {
    actions += cashPending
      ? `<button disabled class="mt-3 w-full flex items-center justify-center gap-2 bg-slate-800 text-slate-400 text-xs font-bold py-2 rounded-lg">⏱ Pesa: inasubiri idhini</button>`
      : `<button data-action="buy" data-id="${g.id}" class="mt-3 w-full flex items-center justify-center gap-2 bg-violet-500 hover:bg-violet-400 text-slate-950 text-xs font-bold py-2 rounded-lg">🔒 Lipa Pesa</button>`;

    if(g.coinCost && Number(g.coinCost) > 0){
      if(!coinReq){
        const enough = state.user && (state.user.coins||0) >= Number(g.coinCost);
        actions += `<button data-action="request-coin-unlock" data-id="${g.id}" ${enough ? "" : "disabled"} class="mt-2 w-full flex items-center justify-center gap-1 text-xs font-bold py-2 rounded-lg ${enough ? "bg-amber-400 hover:bg-amber-300 text-slate-950" : "bg-slate-800 text-slate-500 cursor-not-allowed"}">🪙 Fungua kwa Coins (${g.coinCost})</button>`;
      } else if(coinReq.status==="pending"){
        actions += `<div class="mt-2 text-[11px] text-slate-400 text-center">⏱ Ombi la coins linasubiri code kutoka admin</div>`;
      } else if(coinReq.status==="code_issued"){
        actions += `<button data-action="open-coin-redeem" data-id="${coinReq.id}" class="mt-2 w-full bg-violet-500 hover:bg-violet-400 text-slate-950 text-xs font-bold py-2 rounded-lg">🔑 Weka Code Uliyopewa</button>`;
      } else if(coinReq.status==="rejected"){
        actions += `<div class="mt-2 text-[11px] text-rose-400 text-center">Ombi la coins limekataliwa</div>`;
      }
    }
  }

  const platIcon = g.platform==="PC" ? "🖥" : g.platform==="Android" ? "📱" : "🖥📱";
  return `
  <div class="h-full bg-slate-900/60 border border-slate-800 rounded-xl overflow-hidden hover:border-amber-500/50 transition group glow-card flex flex-col">
    <div class="relative aspect-video bg-slate-800 overflow-hidden">
      ${g.image ? `<img src="${g.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />` : `<div class="w-full h-full flex items-center justify-center text-slate-600 text-3xl">🎮</div>`}
      ${g.trending ? `<div class="absolute top-2 left-2">${badge("🔥 Trending","rose")}</div>` : ""}
      <div class="absolute top-2 right-2">${isFree ? badge("Bure","violet") : badge("Kulipia","amber")}</div>
    </div>
    <div class="p-3 flex-1 flex flex-col">
      <h4 class="font-bold text-sm text-slate-100 truncate">${esc(g.title)}</h4>
      <div class="flex items-center flex-wrap gap-2 mt-1 text-[11px] text-slate-400">
        <span>${platIcon} ${esc(g.platform)}</span>
        ${g.genre ? `<span>${GENRE_ICON[g.genre]||"🎮"} ${esc(g.genre)}</span>` : ""}
        ${g.needsEmulator ? `<span>⚙️ Emulator</span>` : ""}
      </div>
      <div class="mt-auto">
        ${actions}
        ${g.needsEmulator ? [
          g.emulatorLink ? `<a href="${g.emulatorLink}" target="_blank" rel="noreferrer" class="mt-2 flex items-center justify-center gap-1 text-[11px] font-semibold text-violet-300 hover:text-violet-200">⚙️ Emulator →</a>` : "",
          g.firmwareLink ? `<a href="${g.firmwareLink}" target="_blank" rel="noreferrer" class="mt-1 flex items-center justify-center gap-1 text-[11px] font-semibold text-teal-300 hover:text-teal-200">🧩 Firmware →</a>` : "",
          g.prodKeysLink ? `<a href="${g.prodKeysLink}" target="_blank" rel="noreferrer" class="mt-1 flex items-center justify-center gap-1 text-[11px] font-semibold text-yellow-300 hover:text-yellow-200">🔑 Prod Keys →</a>` : "",
        ].join("") : ""}
      </div>
    </div>
  </div>`;
}

function horizontalRow(games){
  if(games.length===0) return `<p class="text-slate-500 text-sm">Hakuna game bado hapa.</p>`;
  return `<div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 snap-x snap-mandatory">
    ${games.map(g => `<div class="flex-none w-40 sm:w-52 snap-start">${gameCard(g)}</div>`).join("")}
  </div>`;
}

/* ================= tournament card ================= */
function tournamentCard(t){
  const myPay = myPaymentsFor();
  const approved = myPay.some(p=>p.type==="tournament" && p.targetId===t.id && p.status==="approved");
  const pending = myPay.some(p=>p.type==="tournament" && p.targetId===t.id && p.status==="pending");
  let action;
  if(approved) action = `<div class="flex items-center gap-2 text-emerald-400 text-xs font-bold">✅ Umeshajiunga</div>`;
  else if(pending) action = `<div class="flex items-center gap-2 text-slate-400 text-xs font-bold">⏱ Inasubiri idhini ya admin</div>`;
  else action = `<button data-action="join-tournament" data-id="${t.id}" class="w-full bg-violet-500 hover:bg-violet-400 text-slate-950 text-xs font-bold py-2 rounded-lg">Jiunge Sasa</button>`;
  return `
  <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 glow-card">
    <div class="flex items-center justify-between mb-2">
      <h4 class="font-bold text-sm">${esc(t.name)}</h4>
      ${badge(t.type==="league" ? "Ligi" : "Knockout", t.type==="league" ? "amber" : "violet")}
    </div>
    <p class="text-xs text-slate-400 mb-3">${esc(t.description)}</p>
    <p class="text-xs text-slate-500 mb-3">Ada ya kujiunga: <span class="text-amber-300 font-semibold">${esc(t.fee)}</span></p>
    ${action}
  </div>`;
}

/* ================= hero slideshow (Home) ================= */
let slideIndex = 0, slideTimer = null;
function updateSlidePosition(){
  const track = document.getElementById("hero-track");
  if(track) track.style.transform = `translateX(-${slideIndex*100}%)`;
  document.querySelectorAll(".hero-dot").forEach((d,i) => {
    d.classList.toggle("bg-white", i===slideIndex);
    d.classList.toggle("bg-white/30", i!==slideIndex);
  });
}
function startSlideshow(total){
  clearInterval(slideTimer);
  if(total <= 1) return;
  slideTimer = setInterval(() => { slideIndex = (slideIndex+1) % total; updateSlidePosition(); }, 2500);
}
function goSlide(i, total){ slideIndex = ((i % total) + total) % total; updateSlidePosition(); startSlideshow(total); }

function heroSlideshowHtml(trending){
  if(trending.length===0){
    return `<div class="rounded-2xl border border-dashed border-slate-800 h-48 sm:h-64 flex items-center justify-center text-slate-600 text-sm mb-8">Hakuna game za trending kwa sasa ili zionekane hapa.</div>`;
  }
  return `
  <div class="relative rounded-2xl overflow-hidden border border-slate-800 h-48 sm:h-64 mb-4 group">
    <div id="hero-track" class="hero-track h-full">
      ${trending.map(g => `
        <div class="hero-slide relative h-full cursor-pointer" data-action="hero-slide-click" data-id="${g.id}">
          ${g.image ? `<img src="${g.image}" class="w-full h-full object-cover"/>` : `<div class="w-full h-full bg-slate-800 flex items-center justify-center text-5xl">🎮</div>`}
          <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/10 to-transparent"></div>
          <div class="absolute bottom-3 left-4 right-4">
            <p class="brandfont font-extrabold text-lg sm:text-2xl text-white drop-shadow">${esc(g.title)}</p>
            <p class="text-[11px] text-amber-300">${g.category==="Bure" ? "Bure — Bofya kufungua" : "Kulipia — Bofya kufungua"}</p>
          </div>
        </div>`).join("")}
    </div>
    ${trending.length > 1 ? `
    <button data-action="hero-prev" class="opacity-0 group-hover:opacity-100 transition absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white w-8 h-8 rounded-full flex items-center justify-center">‹</button>
    <button data-action="hero-next" class="opacity-0 group-hover:opacity-100 transition absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white w-8 h-8 rounded-full flex items-center justify-center">›</button>
    <div class="absolute bottom-2 right-3 flex gap-1.5">
      ${trending.map((_,i) => `<button data-action="hero-dot" data-i="${i}" class="hero-dot w-2 h-2 rounded-full ${i===0 ? "bg-white" : "bg-white/30"}"></button>`).join("")}
    </div>` : ""}
  </div>`;
}

/* ================= ads ================= */
function adScreenHtml(ad, idx){
  if(!ad) return `<div class="aspect-[4/3] rounded-xl border border-dashed border-slate-800 flex items-center justify-center text-slate-600 text-sm">Hakuna tangazo bado</div>`;
  const claimedView = state.user && state.claims.some(c=>c.adId===ad.id && c.userPhone===state.user.phone && c.kind==="view");
  const claimedClick = state.user && state.claims.some(c=>c.adId===ad.id && c.userPhone===state.user.phone && c.kind==="click");
  return `
  <div class="bg-slate-900/60 border border-slate-800 rounded-xl overflow-hidden glow-card">
    <div class="relative aspect-[4/3] bg-slate-800">
      <img src="${ad.image}" class="w-full h-full object-cover" />
      ${state.user && !claimedView ? `<div class="absolute bottom-2 left-2 bg-black/70 text-[11px] px-2 py-1 rounded-full text-amber-300" id="ad-timer-${idx}">Coin baada ya sekunde 5...</div>` : ""}
      ${claimedView ? `<div class="absolute top-2 right-2">${badge("🪙 +5 imepokewa","amber")}</div>` : ""}
    </div>
    <div class="p-3">
      <p class="text-sm text-slate-300 mb-2">${esc(ad.description)}</p>
      <a href="${ad.link}" target="_blank" rel="noreferrer" data-action="ad-click" data-id="${ad.id}" class="flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-violet-500 text-slate-950 text-xs font-bold py-2 rounded-lg">
        Tembelea Link ${!claimedClick ? `<span>🪙+5</span>` : ""}
      </a>
    </div>
  </div>`;
}

/* ================= tabs ================= */
function renderHome(){
  const trending = state.games.filter(g=>g.trending);
  return `
  <section class="mb-6">
    <p class="text-amber-400 text-xs font-bold tracking-widest mb-2">DUKA LA GAME #1</p>
    <h1 class="brandfont text-2xl sm:text-4xl font-extrabold leading-tight mb-2">Pakua Game Ulizozipenda,<br/>Bure au Kulipia.</h1>
    <p class="text-slate-400 text-sm max-w-md mb-4">Tazama matangazo, kusanya coins🪙, na jiunge na tournament za mpira — kila kitu sehemu moja.</p>
  </section>

  <div class="flex items-center gap-2 mb-3"><span class="text-rose-400">🔥</span><h2 class="font-bold">Zinazo-Trend Sasa</h2></div>
  ${heroSlideshowHtml(trending)}

/* ================= ad timers ================= */
let adTimerHandles = [];
function clearAdTimers(){ adTimerHandles.forEach(clearInterval); adTimerHandles = []; }
function startAdTimers(){
  clearAdTimers();
  [0,1].forEach(idx => {
    const ad = state.ads[idx];
    if(!ad || !state.user) return;
    const claimedView = state.claims.some(c=>c.adId===ad.id && c.userPhone===state.user.phone && c.kind==="view");
    if(claimedView) return;
    let seconds = 0;
    const h = setInterval(async () => {
      seconds++;
      const elText = document.getElementById(`ad-timer-${idx}`);
      if(elText) elText.textContent = seconds>=5 ? "Coin imepokewa!" : `Coin baada ya sekunde ${5-seconds}...`;
      if(seconds>=5){
        clearInterval(h);
        await claimCoin(ad, "view");
      }
    }, 1000);
    adTimerHandles.push(h);
  });
}

async function claimCoin(ad, kind){
  if(!state.user) return;
  const claims = await getJSON(K.claims, []);
  if(claims.some(c=>c.adId===ad.id && c.userPhone===state.user.phone && c.kind===kind)) return;
  const next = [...claims, { adId:ad.id, userPhone:state.user.phone, kind, at:Date.now() }];
  await setJSON(K.claims, next);
  const users = await getJSON(K.users, []);
  const idx = users.findIndex(u=>u.phone===state.user.phone);
  if(idx>=0){ users[idx].coins = (users[idx].coins||0) + 5; await setJSON(K.users, users); state.user = users[idx]; }
  await refreshAll();
  renderApp();
}

let payScreenshotData = null;
function fileToDataUrl(file, cb){ const reader = new FileReader(); reader.onload = () => cb(reader.result); reader.onerror = () => cb(null); reader.readAsDataURL(file); }
/* compresses/resizes an uploaded photo before storing it, so uploads are fast and reliable.
   Small files skip the canvas step (fastest path); bigger files fall back to the plain
   picture automatically if resizing ever hangs or fails on a phone. */
function compressImage(file, cb, maxDim=900, quality=0.72){
  try{
    if(!file || file.size < 600*1024){ fileToDataUrl(file, cb); return; }
    let settled = false;
    const finish = (result) => { if(settled) return; settled = true; cb(result); };
    const fallbackTimer = setTimeout(() => fileToDataUrl(file, finish), 6000);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try{
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
            else { width = Math.round(width * (maxDim/height)); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          clearTimeout(fallbackTimer);
          finish(canvas.toDataURL("image/jpeg", quality));
        }catch{ clearTimeout(fallbackTimer); finish(e.target.result); }
      };
      img.onerror = () => { clearTimeout(fallbackTimer); finish(e.target.result); };
      img.src = e.target.result;
    };
    reader.onerror = () => { clearTimeout(fallbackTimer); fileToDataUrl(file, finish); };
    reader.readAsDataURL(file);
  }catch{ fileToDataUrl(file, cb); }
}

/* ================= global click handling ================= */
document.addEventListener("click", async (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ state.tab = tabBtn.dataset.tab; renderApp(); return; }

  const priceBtn = e.target.closest("[data-filter-price]");
  if(priceBtn){ state.storeFilter = priceBtn.dataset.filterPrice; renderApp(); return; }

  const genreBtn = e.target.closest("[data-filter-genre]");
  if(genreBtn){ state.genreFilter = genreBtn.dataset.filterGenre; renderApp(); return; }

  const goGenreBtn = e.target.closest("[data-action='go-genre']");
  if(goGenreBtn){ state.tab="store"; state.genreFilter = goGenreBtn.dataset.genre; state.storeFilter="Zote"; state.searchQuery=""; renderApp(); return; }

  const heroPrev = e.target.closest("[data-action='hero-prev']");
  if(heroPrev){ const total = state.games.filter(g=>g.trending).length; goSlide(slideIndex-1, total); return; }
  const heroNext = e.target.closest("[data-action='hero-next']");
  if(heroNext){ const total = state.games.filter(g=>g.trending).length; goSlide(slideIndex+1, total); return; }
  const heroDot = e.target.closest("[data-action='hero-dot']");
  if(heroDot){ const total = state.games.filter(g=>g.trending).length; goSlide(Number(heroDot.dataset.i), total); return; }
  const heroSlideClick = e.target.closest("[data-action='hero-slide-click']");
  if(heroSlideClick && !heroPrev && !heroNext && !heroDot){
    const g = state.games.find(x=>x.id===heroSlideClick.dataset.id);
    if(g){ state.tab="store"; state.searchQuery = g.title; state.storeFilter="Zote"; state.genreFilter="Zote"; renderApp(); }
    return;
  }

  const act = e.target.closest("[data-action]");
  if(!act) return;
  const action = act.dataset.action;

  if(action === "open-auth"){ openModal({type:"auth", mode:"login"}); return; }
  if(action === "close-modal"){ payScreenshotData = null; closeModal(); return; }
  if(action === "logout"){ state.user = null; renderApp(); return; }
  if(action === "auth-mode"){ openModal({type:"auth", mode: act.dataset.mode}); return; }

  if(action === "auth-submit"){
    const mode = act.dataset.mode;
    const phone = document.getElementById("auth-phone").value.trim();
    const password = document.getElementById("auth-password").value;
    const errorEl = document.getElementById("auth-error");
    const users = await getJSON(K.users, []);
    if(mode === "register"){
      const username = document.getElementById("auth-username").value.trim();
      const gmail = document.getElementById("auth-gmail").value.trim();
      if(!phone || !username || !gmail || !password){ errorEl.textContent = "Tafadhali jaza taarifa zote."; return; }
      if(users.some(u=>u.phone===phone)){ errorEl.textContent = "Namba hii tayari imeshasajiliwa. Jaribu kuingia (Login)."; return; }
      const newUser = { id: uid(), phone, username, gmail, password, coins:0, createdAt: Date.now() };
      await setJSON(K.users, [...users, newUser]);
      state.user = newUser;
      closeModal(); await refreshAll(); renderApp();
    } else {
      if(!phone || !password){ errorEl.textContent = "Tafadhali jaza taarifa zote."; return; }
      const found = users.find(u=>u.phone===phone && u.password===password);
      if(!found){ errorEl.textContent = "Namba ya simu au password sio sahihi."; return; }
      state.user = found;
      closeModal(); await refreshAll(); renderApp();
    }
    return;
  }

  if(action === "download"){
    /* this button only ever renders for a logged-out visitor — always prompt login */
    if(!state.user){ openModal({type:"auth", mode:"login"}); return; }
    return;
  }
  if(action === "download-log"){
    /* the <a> tag already navigates on its own — this just records the download in the background */
    const g = state.games.find(x=>x.id===act.dataset.id);
    if(!g || !state.user) return;
    const paidUnlock = state.payments.some(p=>p.userPhone===state.user.phone && (p.type==="game"||p.type==="coin") && p.targetId===g.id && p.status==="approved");
    logDownload(g, g.category==="Bure" ? "free" : (paidUnlock ? "paid" : "free"));
    return;
  }

  if(action === "buy"){
    const g = state.games.find(x=>x.id===act.dataset.id);
    if(!state.user){ openModal({type:"auth", mode:"login"}); return; }
    openModal({type:"pay", target:g, targetType:"game"});
    return;
  }

  if(action === "request-coin-unlock"){
    const g = state.games.find(x=>x.id===act.dataset.id);
    if(!state.user || !g) return;
    if((state.user.coins||0) < Number(g.coinCost||0)) return;
    const payments = await getJSON(K.payments, []);
    if(payments.some(p=>p.type==="coin" && p.targetId===g.id && p.userPhone===state.user.phone && p.status!=="rejected")) { await refreshAll(); renderApp(); return; }
    const entry = { id: uid(), type:"coin", targetId:g.id, targetName:g.title, userPhone:state.user.phone, username:state.user.username,
      coinCost: Number(g.coinCost), status:"pending", code:null, submittedAt: Date.now() };
    await setJSON(K.payments, [...payments, entry]);
    await refreshAll(); renderApp();
    return;
  }

  if(action === "open-coin-redeem"){
    await refreshAll();
    const req = state.payments.find(p=>p.id===act.dataset.id);
    if(req) openModal({type:"coin-redeem", request:req});
    return;
  }

  if(action === "redeem-submit"){
    const errorEl = document.getElementById("redeem-error");
    const code = document.getElementById("redeem-code").value.trim().toUpperCase();
    const payments = await getJSON(K.payments, []);
    const idx = payments.findIndex(p=>p.id===act.dataset.requestId);
    if(idx < 0){ errorEl.textContent = "Ombi halikupatikana."; return; }
    const req = payments[idx];
    if(!req.code || code !== req.code){ errorEl.textContent = "Code sio sahihi. Jaribu tena au wasiliana na admin."; return; }
    payments[idx] = { ...req, status:"approved" };
    await setJSON(K.payments, payments);
    const users = await getJSON(K.users, []);
    const uIdx = users.findIndex(u=>u.phone===req.userPhone);
    if(uIdx>=0){ users[uIdx].coins = Math.max(0, (users[uIdx].coins||0) - Number(req.coinCost||0)); await setJSON(K.users, users); state.user = users[uIdx]; }
    closeModal(); await refreshAll(); renderApp();
    return;
  }

  if(action === "join-tournament"){
    const t = state.tournaments.find(x=>x.id===act.dataset.id);
    if(!state.user){ openModal({type:"auth", mode:"login"}); return; }
    openModal({type:"pay", target:t, targetType:"tournament"});
    return;
  }

  if(action === "ad-click"){
    const ad = state.ads.find(x=>x.id===act.dataset.id);
    if(ad && state.user) await claimCoin(ad, "click");
    return;
  }

  if(action === "pay-submit"){
    const errorEl = document.getElementById("pay-error");
    const payerPhone = document.getElementById("pay-phone").value.trim();
    if(!payerPhone || !payScreenshotData){ errorEl.textContent = "Weka namba uliyotumia kulipia na picha ya muamala."; return; }
    const type = act.dataset.type;
    const id = act.dataset.id;
    const target = type==="game" ? state.games.find(x=>x.id===id) : state.tournaments.find(x=>x.id===id);
    const payments = await getJSON(K.payments, []);
    const entry = { id: uid(), type, targetId: id, targetName: target.title||target.name, userPhone: state.user.phone,
      username: state.user.username, payerPhone, screenshot: payScreenshotData, status:"pending", submittedAt: Date.now() };
    const ok = await setJSON(K.payments, [...payments, entry]);
    if(!ok){ errorEl.textContent = "Imeshindwa kutuma — angalia mtandao wako kisha jaribu tena."; return; }
    payScreenshotData = null;
    closeModal(); await refreshAll(); renderApp();
    return;
  }
});

/* ================= init ================= */
renderApp();
if(!STORAGE_OK){
  const warn = document.createElement("div");
  warn.className = "max-w-6xl mx-auto px-4 pt-3 text-[11px] text-amber-300";
  warn.textContent = "⚠️ Bado hujaweka DB_URL yako ya Firebase kwenye code (juu ya <script>). Bila hiyo, akaunti, coins na malipo havitahifadhika.";
  document.body.insertBefore(warn, document.getElementById("app"));
}
(async function init(){
  await refreshAll();
  await bumpVisit();
  renderApp();
  setInterval(async () => { await refreshAll(); renderApp(); }, 8000);
})();
</script>
</body>
