function ovAfter(){document.querySelectorAll('.kpi b').forEach(b=>{const raw=b.textContent.replace(/,/g,''),n=Number(raw);if(!Number.isFinite(n)||n<=0)return;let k=0;const st=Math.max(1,Math.ceil(n/25)),t=setInterval(()=>{k=Math.min(n,k+st);b.textContent=Math.round(k).toLocaleString('en-US');if(k>=n)clearInterval(t)},35)})}

(function(){const c=$('#fx');if(!c)return;const x=c.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,P=[],S=[],t=0;const C=['66,255,155','0,200,255','177,140,255','255,60,166'];
 function size(){const d=Math.min(devicePixelRatio||1,1.5);W=c.width=innerWidth*d;H=c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);W/=d;H/=d;const n=Math.min(innerWidth<600?32:70,Math.floor(W*H/18000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,c:C[Math.random()*4|0]}));S=Array.from({length:innerWidth<600?6:12},()=>({x:Math.random()*W,y:Math.random()*H,v:2+Math.random()*4,l:40+Math.random()*90,c:C[Math.random()*2|0]}))}
 function frame(){t+=.012;x.clearRect(0,0,W,H);
  [[.2,.25,C[1]],[.8,.3,C[2]],[.5,.9,C[0]]].forEach(([a,b,col],k)=>{const px=W*(a+Math.sin(t+k*2)*.08),py=H*(b+Math.cos(t*.8+k)*.08),g=x.createRadialGradient(px,py,0,px,py,Math.max(W,H)*.45);g.addColorStop(0,`rgba(${col},.13)`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(0,0,W,H)});
  const hz=H*.64;x.lineWidth=1;for(let i=-14;i<=14;i++){const bx=W/2+i*W*.09;x.strokeStyle=`rgba(0,200,255,${.16-Math.abs(i)*.007})`;x.beginPath();x.moveTo(W/2+i*8,hz);x.lineTo(bx*1.5-W*.25,H);x.stroke()}
  for(let j=0;j<9;j++){const k=((j+t*2.2)%9)/9,y=hz+(H-hz)*k*k;x.strokeStyle=`rgba(177,140,255,${.05+k*.2})`;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  S.forEach(s=>{s.y+=s.v;if(s.y>H+s.l){s.y=-s.l;s.x=Math.random()*W}const g=x.createLinearGradient(0,s.y-s.l,0,s.y);g.addColorStop(0,`rgba(${s.c},0)`);g.addColorStop(1,`rgba(${s.c},.55)`);x.strokeStyle=g;x.beginPath();x.moveTo(s.x,s.y-s.l);x.lineTo(s.x,s.y);x.stroke()});
  P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.fillStyle=`rgba(${p.c},.9)`;x.fillRect(p.x-1,p.y-1,2.4,2.4);for(let j=i+1;j<P.length;j++){const q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<12000){x.strokeStyle=`rgba(${p.c},${.22*(1-d/12000)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});
  if(!still)requestAnimationFrame(frame)}
 size();addEventListener('resize',size);frame()})();
async function deleteChild(path,k){try{const res=await fetch(DB+'/'+path+'/'+encodeURIComponent(String(k))+'.json',{method:'DELETE'});if(!res.ok){let detail='';try{detail=(await res.text()).slice(0,220)}catch{}window.__lastFirebaseError=`${res.status} ${detail}`;return false}window.__lastFirebaseError='';return true}catch(e){window.__lastFirebaseError=String(e);return false}}
async function recordDelete(kind,k,question,success){if(k===undefined||k===null||k==='')return notify('Rekodi haijatambulika; refresh dashboard kisha jaribu tena.');if(!confirm(question))return;if(await deleteChild(K[kind],k)){notify(success);await load()}else notify('Imeshindwa kufuta: '+(window.__lastFirebaseError||'Kagua Firebase rules/mtandao.'))}
async function gameDelete(k){if(k===undefined||k===null||k==='')return notify('Game haijatambulika. Bonyeza Refresh kisha ujaribu tena.');const key=String(k),btn=document.querySelector('[data-deletegame="'+CSS.escape(key)+'"]');if(!btn)return notify('Kitufe hakijapatikana. Bonyeza Refresh.');
if(!btn.dataset.armed){btn.dataset.armed='1';const old=btn.textContent;btn.textContent='⚠ Gusa tena kufuta';setTimeout(()=>{delete btn.dataset.armed;btn.textContent=old},4000);return}
btn.disabled=true;btn.textContent='Inafuta...';const row=btn.closest('.game-manager-item');let ok=await deleteChild(K.games,key);if(!ok&&!/^(401|403)|permission/i.test(String(window.__lastFirebaseError||''))){ok=await put(K.games+'/'+key,null)}
if(ok){if(Array.isArray(d.games)){const c=[...d.games];c[Number(key)]=null;d.games=c}else{const c={...(d.games||{})};delete c[key];d.games=c}if(row){row.style.transition='opacity .2s';row.style.opacity='0';setTimeout(()=>row.remove(),200)}notify('Game imefutwa kabisa ✓');document.querySelectorAll('h3').forEach(h=>{if(h.textContent.startsWith('Game zilizopostiwa'))h.textContent='Game zilizopostiwa ('+vals(d.games).length+')'})}
else{delete btn.dataset.armed;btn.disabled=false;btn.textContent='🗑 Futa';const c=String(window.__lastFirebaseError||'');const den=/^(401|403)|permission/i.test(c);notify('Imeshindwa kufuta game: '+(c||'hakuna mawasiliano')+(den?' → Firebase rules zinakataa kufuta. Fungua Firebase Console → Realtime Database → Rules, ruhusu kuandika kwenye mgs/games, kisha Publish.':' → Kagua intaneti na ufungue dashboard kwenye Chrome.'))}}
async function paymentAction(k,status){const p=(d.payments||{})[k];if(!p)return notify('Malipo hayakupatikana. Bonyeza Refresh.');if((p.status||'pending')!=='pending')return notify('Malipo haya tayari yameshughulikiwa ('+p.status+').');

if(btn&&btn.dataset.armed!=='1'){btn.dataset.armed='1';const o=btn.textContent;btn.textContent=status==='approved'?'⚠ Gusa tena kukubali':'⚠ Gusa tena kukataa';setTimeout(()=>{btn.dataset.armed='';btn.textContent=o},4000);return}
if(btn){btn.disabled=true;btn.textContent='Inatuma...'}

if(!await put(K.payments+'/'+k,np)){notify('Imeshindwa kubadilisha malipo: '+(window.__lastFirebaseError||'hakuna mawasiliano')+' → Kagua Firebase rules.');return render()}

else notify(status==='approved'?'Malipo yamekubaliwa ✓':'Malipo yamekataliwa ✓');
render()}
