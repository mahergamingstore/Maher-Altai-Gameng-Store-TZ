<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaherGamingStore — Admin Studio</title><style>
:root{--bg:#080b12;--p:#101925;--line:#25384b;--g:#42ff9b;--b:#00c8ff;--gold:#f4ca62;--t:#eef6ff;--m:#91a2b9}*{box-sizing:border-box}body{margin:0;color:var(--t);background:radial-gradient(ellipse at 12% 0,#12384a,transparent 34%),var(--bg);font:14px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.field{width:100%;padding:11px;border:1px solid #2c4054;border-radius:10px;background:#080e17;color:var(--t)}.btn{padding:9px 13px;border:1px solid #34516a;border-radius:10px;background:#152436;font-weight:750}.primary{background:linear-gradient(110deg,var(--g),var(--b));color:#06120c;border:0}.gold{background:linear-gradient(110deg,#ffe69a,#c08b26);color:#241800;border:0}.danger{border-color:#6b3444;color:#ff9cae}.muted{color:var(--m)}.panel{background:linear-gradient(145deg,#111b29,#0a111a);border:1px solid var(--line);border-radius:17px;padding:16px}.label{display:block;color:#a9b9cb;font-size:12px;margin:0 0 5px}.kicker{font-size:10px;letter-spacing:.2em;color:var(--g);font-weight:900}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;background:#070c13ed;border-bottom:1px solid #203346}.brand{font-weight:950;letter-spacing:.05em}.brand span{color:var(--g)}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 65px)}aside{padding:14px;border-right:1px solid #203346;background:#090f18}.side{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#aab9cc;padding:11px;border-radius:10px;margin-bottom:5px}.side.active,.side:hover{color:var(--g);background:#11231f;border-color:#27513f}.content{max-width:1450px;width:100%;margin:auto;padding:22px}.title{margin-bottom:17px}.title h1{font-size:26px;margin:4px 0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.stat strong{font-size:27px;display:block;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{padding:12px;border:1px solid #31556b;background:#0b1c28;border-radius:10px;margin-bottom:12px}.hidden{display:none!important}.pill{font-size:10px;border:1px solid #34516a;border-radius:30px;padding:4px 8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #243348;font-size:12px;vertical-align:top}th{color:#a9bdd1}.upload{padding:12px;border:1px dashed #35506a;border-radius:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:4px;position:sticky;top:63px;z-index:4;border-right:0;border-bottom:1px solid #203346}.side{white-space:nowrap;width:auto;margin:0}.content{padding:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){header{padding:12px}.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.title h1{font-size:22px}}

</style></head><body><header><div><div class="brand">MAHER<span>GAMING</span>STORE / ADMIN STUDIO</div><div class="muted" style="font-size:11px">Dashboard mpya · Database iliyopo</div></div><div class="row"><span id="conn" class="pill">Inaunganisha...</span><button class="btn" id="reload">↻ Refresh</button></div></header><div class="layout"><aside id="side"><button class="side active" data-tab="overview">◈ Overview</button><button class="side" data-tab="games">🎮 Games</button><button class="side" data-tab="brand">🎨 Brand & Category</button><button class="side" data-tab="emulators">🕹️ Emulators</button><button class="side" data-tab="payments">💳 Malipo</button><button class="side" data-tab="prime">👑 Coin & Prime</button><button class="side" data-tab="spin">🎡 Spin Zone</button><button class="side" data-tab="ads">📣 Ads & Notifications</button><button class="side" data-tab="market">🛍️ Marketplace</button><button class="side" data-tab="chat">💬 Online Chat</button><button class="side" data-tab="settings">⚙️ Settings</button></aside><main class="content"><div id="notice" class="notice hidden"></div><div id="view"></div></main></div>
<script>
const DB='https://mahergamingstore-default-rtdb.firebaseio.com',K={users:'mgs/users',games:'mgs/games',settings:'mgs/settings',ads:'mgs/ads',payments:'mgs/payments',claims:'mgs/coinclaims',marketplace:'mgs/marketplace',notifications:'mgs/notifications',onlineChats:'mgs/onlineChats'};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),vals=o=>o&&Array.isArray(o)?o:Object.entries(o||{}).map(([key,v])=>({...v,_key:key})),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);let d={},tab='overview';
async function get(k,f={}){try{let r=await fetch(DB+'/'+k+'.json');if(!r.ok){console.warn('Firebase read failed',k,r.status);return f}return (await r.json())??f}catch(e){console.warn('Firebase read error',k,e);return f}}
async function put(k,v){try{let r=await fetch(DB+'/'+k+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok){let detail='';try{detail=(await r.text()).slice(0,220)}catch{};console.error('Firebase write failed',k,r.status,detail);window.__lastFirebaseError=`${r.status} ${detail}`;return false}window.__lastFirebaseError='';return true}catch(e){console.error('Firebase write error',k,e);window.__lastFirebaseError=String(e);return false}}
async function post(k,v){try{let r=await fetch(DB+'/'+k+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});if(!r.ok){let detail='';try{detail=(await r.text()).slice(0,220)}catch{};console.error('Firebase post failed',k,r.status,detail);window.__lastFirebaseError=`${r.status} ${detail}`;return null}window.__lastFirebaseError='';return await r.json()}catch(e){console.error('Firebase post error',k,e);window.__lastFirebaseError=String(e);return null}}function title(t,desc){return `<div class="title"><div class="kicker">MAHER GAMING STORE / CONTROL</div><h1>${t}</h1><div class="muted">${desc||''}</div></div>`}function field(l,id,v='',type='text',extra=''){return `<label><span class="label">${l}</span><input class="field" id="${id}" type="${type}" value="${esc(v)}" ${extra}></label>`}function table(items,cols,action){return `<div class="panel tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}${action?'<th>Action</th>':''}</tr></thead><tbody>${items.map((x,i)=>`<tr>${cols.map(c=>`<td>${c[2]?c[2](x):esc(x[c[0]]??'')}</td>`).join('')}${action?`<td>${action(x,i)}</td>`:''}</tr>`).join('')||`<tr><td class="muted" colspan="${cols.length+(action?1:0)}">Hakuna rekodi kwa sasa.</td></tr>`}</tbody></table></div>`}async function load(){let names=Object.keys(K),v=await Promise.all(names.map(k=>get(K[k],{})));d={};names.forEach((k,i)=>d[k]=v[i]);let connected=v.some(x=>x&&Object.keys(x).length);$('#conn').textContent=connected?'Database data imepatikana':'Database tupu / ruhusa';$('#conn').style.color=connected?'var(--g)':'var(--gold)';render()}function notify(t){$('#notice').textContent=t;$('#notice').classList.remove('hidden');clearTimeout(window.__noticeTimer);window.__noticeTimer=setTimeout(()=>$('#notice').classList.add('hidden'),6500)}
async function saveSettings(next){
  try{
    // Merge only fields changed from the last loaded snapshot into the latest database value,
    // so one settings save does not erase unrelated updates made in another tab.
    const base=d.settings||{};
    const read=await fetch(DB+'/'+K.settings+'.json');
    if(!read.ok){const detail=await read.text().catch(()=> '');notify('Hifadhi imesimamishwa: database haikusomeka ('+read.status+'). Hakuna data iliyobadilishwa.');console.error('Settings read before save failed',read.status,detail);return false}
    const latest=(await read.json())||{}, patch={};
    for(const [key,value] of Object.entries(next||{})) if(JSON.stringify(value)!==JSON.stringify(base[key])) patch[key]=value;
    const merged={...latest,...patch};
    for(const key of ['categoryCovers']) if(patch[key]&&latest[key]) merged[key]={...latest[key],...patch[key]};
    if(await put(K.settings,merged)){d.settings=merged;notify('Imehifadhiwa kwenye database ✓');await load();return true}
    notify('HAIKUHIFADHIWA. Firebase: '+(window.__lastFirebaseError||'hakuna ruhusa/mtandao.'));return false;
  }catch(e){console.error(e);notify('Hitilafu ya kuhifadhi: '+e.message);return false}
}
async function fileData(file){
  if(!file)throw new Error('Hakuna picha iliyochaguliwa.');
  if(!file.type.startsWith('image/'))throw new Error('Faili ulilochagua si picha.');
  const dataUrl=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(new Error('Imeshindikana kusoma picha.'));fr.readAsDataURL(file)});
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Picha haifunguki. Chagua picha nyingine.'));im.src=dataUrl});
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const maxSide=1100,scale=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)throw new Error('Browser haiwezi kuandaa picha.');
  let out='';
  for(let pass=0;pass<5;pass++){
    canvas.width=w;canvas.height=h;ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    // WebP keeps transparent logos and reduces image size before sending to Firebase.
    const quality=[.82,.74,.66,.58,.5][pass];out=canvas.toDataURL('image/webp',quality);
    if(!out.startsWith('data:image/webp')){const bg=document.createElement('canvas');bg.width=w;bg.height=h;const c=bg.getContext('2d');c.fillStyle='#101925';c.fillRect(0,0,w,h);c.drawImage(canvas,0,0);out=bg.toDataURL('image/jpeg',quality)}
    if(out.length<520000)break;w=Math.max(1,Math.round(w*.82));h=Math.max(1,Math.round(h*.82));
  }
  if(out.length>=900000)throw new Error('Picha bado ni kubwa sana. Punguza ukubwa wa picha kisha ujaribu tena.');
  return out;
}
function render(){document.querySelectorAll('.side').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let r=$('#view'),s=d.settings||{},users=vals(d.users),games=vals(d.games),payments=vals(d.payments),ads=vals(d.ads);if(tab==='overview')r.innerHTML=title('Overview','Muhtasari wa data bila kufuta chochote.')+`<div class="stats"><div class="panel stat"><span class="muted">Watumiaji</span><strong>${users.length}</strong></div><div class="panel stat"><span class="muted">Game zilizopo DB</span><strong>${games.length}</strong></div><div class="panel stat"><span class="muted">Malipo pending</span><strong>${payments.filter(x=>x.status==='pending').length}</strong></div><div class="panel stat"><span class="muted">Bidhaa sokoni</span><strong>${vals(d.marketplace).length}</strong></div></div><div class="grid"><section class="panel"><h3>Haraka</h3><div class="row"><button class="btn primary" data-go="games">+ Ongeza game</button><button class="btn" data-go="brand">Brand & categories</button><button class="btn gold" data-go="prime">Coin / Prime</button></div></section><section class="panel"><h3>Database iliyopo</h3><p class="muted">${DB}</p><p class="muted">Dashboard hii haitafuta data ya zamani yenyewe. Game list mpya inasoma records zilizopo database.</p></section></div>`;
else if(tab==='games'){const cats=[...new Set(['Action','Adventure','FPS Shooter','Simulator','Sports','Racing',...(s.customGenres||[])])];r.innerHTML=title('Game Manager','Fomu kamili ya game. Category mpya itakuuliza kama uunde category hiyo.')+`<section class="panel"><h3 id="formTitle">Game mpya</h3><form id="gameForm" class="formgrid">
${field('Game name','gn')}${field('Bei (TZS; 0 = bure)','gp','0','number','min="0"')}
<label><span class="label">Category (andika au chagua)</span><input class="field" id="gg" list="gameCategories" placeholder="Mfano: Open World" required><datalist id="gameCategories">${cats.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
${field('Platform / emulator','gpl','','text','placeholder="Mfano: Android / PPSSPP / Vita3K"')}
${field('Game APK link','gl','','url')}${field('OBB link','gobb','','url')}${field('Data link','gdata','','url')}
<label><span class="label">Emulator required</span><select class="field" id="ge"><option value="no">No</option><option value="yes">Yes</option></select></label>
<label><span class="label">Star — ubora wa game (1–5)</span><select class="field" id="gstar"><option value="5">★★★★★ — 5</option><option value="4">★★★★☆ — 4</option><option value="3">★★★☆☆ — 3</option><option value="2">★★☆☆☆ — 2</option><option value="1">★☆☆☆☆ — 1</option></select></label>
${field('RAM support','gram','','text','placeholder="Mfano: 3GB RAM au 4GB+"')}
${field('Picha ya game (URL)','gi','','url')}${field('Link ya kuseti / installation guide','gsetup','','url')}${field('Link ya video ya YouTube','gyoutube','','url')}
${field('Maelezo ya game','gd')}${field('Trending score','gt','0','number')}${field('Game ID (edit tu)','gid')}
<label class="full upload"><span class="label">Au pakia picha ya game</span><input class="field" id="gfile" type="file" accept="image/*"><div id="gameImagePreview" class="muted" style="margin-top:8px"></div></label>
<div class="full row"><button class="btn primary">Hifadhi game</button><button class="btn" type="button" id="clearGame">Futa fomu</button></div></form></section><div style="height:14px"></div>${table(games.sort((a,b)=>String(a.name||a.title||'').localeCompare(String(b.name||b.title||''))),[['name','Game'],['genre','Category'],['price','Bei'],['platform','Platform / emulator'],['starRating','Star'],['ramSupport','RAM']],(x)=>`<button class="btn" data-edit="${esc(x._key||x.id)}">Hariri</button> <button class="btn danger" data-deletegame="${esc(x._key||x.id)}">Futa</button>`)} `;bindGame()}

async function gameDelete(k){if(!confirm('Una uhakika unataka kufuta game hii kutoka database?'))return;let x=d.games||{};delete x[k];if(await put(K.games,x)){notify('Game imefutwa.');await load()}else notify('Imeshindwa kufuta: '+(window.__lastFirebaseError||'Kagua Firebase rules.'))}async function paymentAction(k,status){let p=(d.payments||{})[k];if(!p)return notify('Payment record haikupatikana');if(status==='approved'&&!confirm('Umethibitisha muamala kwenye mtandao wa simu?'))return;p.status=status;p.reviewedAt=Date.now();if(!await put(K.payments+'/'+k,p))return notify('Imeshindwa kubadilisha status.');if(status==='approved'&&(p.type==='coin'||p.type==='prime')){let u=(d.users||{})[p.uid];if(u){if(p.type==='coin')u.coins=Number(u.coins||0)+Number(p.coinAmount||0);if(p.type==='prime')u.primeUntil=Math.max(Date.now(),Number(u.primeUntil||0))+Number(p.days||30)*86400000;await put(K.users+'/'+p.uid,u)}}notify('Status imesasishwa. Kagua kiasi na uid kabla ya kuongeza coin.');load()}async function marketAction(k,status){let x=d.marketplace||{};if(!x[k])return;if(status==='deleted'){if(!confirm('Futa bidhaa hii?'))return;delete x[k];await put(K.marketplace,x)}else{x[k].status=status;await put(K.marketplace,x)}load()}async function chatDelete(k){if(!confirm('Futa ujumbe huu?'))return;let x=d.onlineChats||{};delete x[k];await put(K.onlineChats,x);load()}
$('#side').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('#reload').onclick=load;load();
</script></body></html>
