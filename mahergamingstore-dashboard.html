function withTimeout(promise, ms){
  return new Promise((resolve) => {
    let done = false;
    const timer = setTimeout(() => { if(!done){ done = true; resolve(null); } }, ms);
    Promise.resolve(promise).then((v) => { if(!done){ done = true; clearTimeout(timer); resolve(v); } })
      .catch(() => { if(!done){ done = true; clearTimeout(timer); resolve(null); } });
  });
}
const STORAGE_OK = !DB_URL.includes("PROJECT-ID");
async function getJSON(key, fallback){
  if(!STORAGE_OK) return fallback;
  try{
    const res = await withTimeout(fetch(`${DB_URL}/${key}.json`), 20000);
    if(!res) return fallback;
    const data = await res.json();
    return (data === null || data === undefined) ? fallback : data;
  }catch{ return fallback; }
}
async function setJSON(key, value){
  if(!STORAGE_OK) return false;
  try{
    const res = await withTimeout(fetch(`${DB_URL}/${key}.json`, { method:"PUT", body: JSON.stringify(value) }), 20000);
    return !!res && res.ok;
  }catch(e){ console.error("storage set failed", e); return false; }
}

function fileToDataUrl(file, cb){ const reader = new FileReader(); reader.onload = () => cb(reader.result); reader.onerror = () => cb(null); reader.readAsDataURL(file); }
/* compresses/resizes an uploaded image before storing it, so uploads are fast and reliable.
   Small files skip the canvas step entirely (fastest, most reliable path). Bigger files get
   resized; if that ever hangs or fails on a phone, it automatically falls back to the plain
   picture after a few seconds instead of getting stuck forever. */
function compressImage(file, cb, maxDim=900, quality=0.72){
  try{
    if(!file || file.size < 600*1024){ fileToDataUrl(file, cb); return; }
    let settled = false;
    const finish = (result) => { if(settled) return; settled = true; cb(result); };
    const fallbackTimer = setTimeout(() => fileToDataUrl(file, finish), 6000);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try{
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
            else { width = Math.round(width * (maxDim/height)); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          clearTimeout(fallbackTimer);
          finish(canvas.toDataURL("image/jpeg", quality));
        }catch{ clearTimeout(fallbackTimer); finish(e.target.result); }
      };
      img.onerror = () => { clearTimeout(fallbackTimer); finish(e.target.result); };
      img.src = e.target.result;
    };
    reader.onerror = () => { clearTimeout(fallbackTimer); fileToDataUrl(file, finish); };
    reader.readAsDataURL(file);
  }catch{ fileToDataUrl(file, cb); }
}

function normalizeUrl(u){
  if(!u) return u;
  const t = u.trim();
  if(!t) return t;
  if(/^https?:\/\//i.test(t)) return t;
  if(/^\/\//.test(t)) return "https:" + t;
  return "https://" + t;
}

/* ================= focus-preserving render wrapper ================= */
function withFocusPreserved(fn){
  const active = document.activeElement;
  const id = active && active.id;
  const tag = active && active.tagName;
  let selStart, selEnd;
  if(id && (tag === "INPUT" || tag === "TEXTAREA")){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  fn();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if((tag === "INPUT" || tag === "TEXTAREA") && typeof selStart === "number" && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

let skipFormSync = false; // set true right before a render that must NOT pull stale values back from the old DOM (e.g. loading a game into the form to edit it)

let spinConfigLoaded = false; // spinConfig is only pulled from Firebase ONCE — after that it's owned by
// the on-screen form (like gameForm/adForm), so periodic refreshes never wipe an image you just
// uploaded before you hit "Hifadhi Spin". This was the cause of uploaded pictures "disappearing".
async function refresh(){
  const [u,g,a,t,s,p,st,sp,cp,mk,vp,va,adv] = await Promise.all([
    getJSON(K.users, []), getJSON(K.games, []), getJSON(K.ads, []), getJSON(K.tournaments, []),
    getJSON(K.settings, {}), getJSON(K.payments, []), getJSON(K.stats, { visits:0, dailyDownloads:{}, downloadsLog:[] }),
    getJSON(K.spinConfig, { symbols: [], costCoins: 0 }), getJSON(K.coinPackages, []),
    getJSON(K.marketplace, []), getJSON(K.vipPlans, []), getJSON(K.videoAd, { videoUrl:"", watchSeconds:10, blockAdsCost:0 }), getJSON(K.adminAdvice, []),
  ]);
  state.users=u; state.games=g; state.ads=a; state.tournaments=t; state.settings=s; state.payments=p; state.stats=st;
  if(!spinConfigLoaded){
    state.spinConfig = sp && sp.symbols ? sp : { symbols: [], costCoins: 0 };
    while(state.spinConfig.symbols.length < 5) state.spinConfig.symbols.push({ id: uid(), image:"", level:"normal", weight: SPIN_LEVEL_WEIGHT.normal });
    state.spinConfig.symbols.forEach(s => { if(!s.level) s.level = "normal"; });
    spinConfigLoaded = true;
  }
  state.coinPackages = cp || [];
  state.marketplace = mk || [];
  state.vipPlans = vp || [];
  if(!videoAdLoaded){ state.videoAd = va && typeof va === "object" ? va : { videoUrl:"", watchSeconds:10, blockAdsCost:0 }; videoAdLoaded = true; }
  state.adminAdvice = adv || [];
}
let videoAdLoaded = false; // same reasoning as spinConfigLoaded — protects the settings form from being wiped mid-edit

function renderMarketPanel(){
  const pending = state.marketplace.filter(m=>m.status==="pending");
  const approved = state.marketplace.filter(m=>m.status==="approved");
  const rejected = state.marketplace.filter(m=>m.status==="rejected");
  return `
  <h3 class="font-bold mb-3">⏱ Bidhaa Zinazosubiri Idhini (${pending.length})</h3>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
    ${pending.map(m=>`
      <div class="bg-slate-900/70 border border-amber-500/30 rounded-xl p-3">
        <img src="${m.image}" class="w-full rounded-lg border border-slate-800 mb-2 max-h-40 object-cover bg-slate-950"/>
        <p class="text-xs font-bold">${esc(m.productName)}</p>
        <p class="text-[11px] text-amber-300 font-bold">${esc(m.price)}</p>
        <p class="text-[11px] text-slate-400">${esc(m.category)} · ${esc(m.username)} (${esc(m.sellerPhone)})</p>
        <div class="flex gap-2 mt-2">
          <button data-action="decide-market" data-id="${m.id}" data-status="approved" class="flex-1 bg-emerald-500 text-slate-950 font-bold text-xs py-2 rounded-lg">✅ Ruhusu</button>
          <button data-action="decide-market" data-id="${m.id}" data-status="rejected" class="flex-1 bg-rose-500/80 text-slate-950 font-bold text-xs py-2 rounded-lg">✖ Kataa</button>
        </div>
      </div>`).join("") || `<p class="text-slate-600 text-xs">Hakuna bidhaa mpya zinazosubiri.</p>`}
  </div>

  <h3 class="font-bold mb-3">✅ Bidhaa Zilizoruhusiwa (${approved.length})</h3>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
    ${approved.map(m=>`
      <div class="flex items-center gap-3 bg-slate-950/60 rounded-lg p-2">
        <img src="${m.image}" class="w-12 h-12 rounded object-cover"/>
        <div class="flex-1 min-w-0"><p class="text-xs font-bold truncate">${esc(m.productName)}</p><p class="text-[10px] text-slate-500">${esc(m.price)} · ${esc(m.category)}</p></div>
        <button data-action="remove-market" data-id="${m.id}" class="p-1.5 rounded text-slate-600 hover:text-rose-400">🗑</button>
      </div>`).join("") || `<p class="text-slate-600 text-xs">Bado hakuna bidhaa zilizoruhusiwa.</p>`}
  </div>

  ${rejected.length > 0 ? `
  <h3 class="font-bold mb-3 text-slate-400 text-sm">Zilizokataliwa</h3>
  <div class="space-y-2">
    ${rejected.map(m=>`<div class="flex items-center justify-between bg-slate-950/60 rounded-lg p-2 text-xs">
      <span>${esc(m.productName)} — ${esc(m.username)}</span>
      <button data-action="remove-market" data-id="${m.id}" class="text-rose-400">Futa</button>
    </div>`).join("")}
  </div>` : ""}`;
}

/* ================= render root ================= */
function _render(){
  if(skipFormSync){ skipFormSync = false; } else { syncAllForms(); }
  renderNav();
  const main = document.getElementById("main");
  if(state.tab==="overview") main.innerHTML = renderOverview();
  else if(state.tab==="games") main.innerHTML = renderGames();
  else if(state.tab==="ads") main.innerHTML = renderAds();
  else if(state.tab==="market") main.innerHTML = renderMarketPanel();
  else if(state.tab==="coins") main.innerHTML = renderCoinsPanel();
  else if(state.tab==="payments") main.innerHTML = renderPayments();
  else if(state.tab==="users") main.innerHTML = renderUsers();
}
function render(){ withFocusPreserved(_render); }

/* ================= file input handling ================= */
document.addEventListener("change", (e) => {
  if(e.target.id === "g-image" && e.target.files[0]){ document.getElementById("g-image-label").textContent = "Inasindika picha..."; compressImage(e.target.files[0], d => { state.gameForm.image = d; document.getElementById("g-image-label").textContent = "Picha imewekwa ✔"; }); }
  if(e.target.id === "g-emu-image" && e.target.files[0]){ document.getElementById("g-emu-image-label").textContent = "Inasindika picha..."; compressImage(e.target.files[0], d => { state.gameForm.emulatorImage = d; document.getElementById("g-emu-image-label").textContent = "Picha imewekwa ✔"; }); }
  if(e.target.id === "a-image" && e.target.files[0]){ document.getElementById("a-image-label").textContent = "Inasindika picha..."; compressImage(e.target.files[0], d => { state.adForm.image = d; document.getElementById("a-image-label").textContent = "Picha imewekwa ✔"; }); }
  if(e.target.id === "g-screenshot-add" && e.target.files[0]){
    compressImage(e.target.files[0], d => {
      if(!state.gameForm.screenshots) state.gameForm.screenshots = [];
      state.gameForm.screenshots.push(d);
      render();
    });
  }
  if(e.target.id === "g-needs-emu"){ render(); }
  if(e.target.dataset && e.target.dataset.spinImage !== undefined && e.target.files[0]){
    const i = Number(e.target.dataset.spinImage);
    compressImage(e.target.files[0], d => { state.spinConfig.symbols[i].image = d; render(); });
  }
});

/* ================= global click handling ================= */
document.addEventListener("click", async (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ state.tab = tabBtn.dataset.tab; render(); return; }

  const act = e.target.closest("[data-action]");
  if(!act) return;
  const action = act.dataset.action;

  if(action === "save-game"){
    const f = state.gameForm;
    f.title = document.getElementById("g-title").value.trim();
    f.category = document.getElementById("g-category").value;
    f.genre = document.getElementById("g-genre").value;
    f.coinCost = document.getElementById("g-coincost").value.trim();
    f.price = document.getElementById("g-price").value.trim();
    f.linkApk = normalizeUrl(document.getElementById("g-link-apk").value.trim());
    f.linkObb = normalizeUrl(document.getElementById("g-link-obb").value.trim());
    f.linkData = normalizeUrl(document.getElementById("g-link-data").value.trim());
    f.platform = document.getElementById("g-platform").value;
    f.needsEmulator = document.getElementById("g-needs-emu").checked;
    if(f.needsEmulator){
      f.emulatorLink = normalizeUrl(document.getElementById("g-emu-link").value.trim());
      f.firmwareLink = normalizeUrl(document.getElementById("g-firmware-link").value.trim());
      f.prodKeysLink = normalizeUrl(document.getElementById("g-prodkeys-link").value.trim());
      f.emulatorCategory = document.getElementById("g-emulator-category").value;
    }
    f.trending = document.getElementById("g-trending").checked;
    f.description = document.getElementById("g-description").value.trim();
    f.fileSize = document.getElementById("g-filesize").value.trim();
    f.version = document.getElementById("g-version").value.trim();
    f.releaseDate = document.getElementById("g-releasedate").value;
    f.reqMin = document.getElementById("g-reqmin").value.trim();
    f.reqRec = document.getElementById("g-reqrec").value.trim();
    f.compatibility = document.getElementById("g-compatibility").value;
    f.trailerUrl = normalizeUrl(document.getElementById("g-trailer").value.trim());
    if(!f.title || !f.linkApk){ alert("Weka jina la game na link ya APK ya game."); return; }
    let nextGames;
    if(state.editingGameId){
      nextGames = state.games.map(g => g.id===state.editingGameId ? { ...g, ...f, id: state.editingGameId, updatedAt: Date.now() } : g);
    } else {
      nextGames = [...state.games, { id: uid(), ...f, updatedAt: Date.now() }];
    }
    const ok = await setJSON(K.games, nextGames);
    if(!ok){ alert("Imeshindwa kuhifadhi game — angalia mtandao wako kisha jaribu tena."); return; }
    skipFormSync = true;
    state.gameForm = { ...emptyGameForm };
    state.editingGameId = null;
    await refresh(); render();
    return;
  }
  if(action === "edit-game"){
    const g = state.games.find(x=>x.id===act.dataset.id);
    if(!g) return;
    skipFormSync = true;
    state.editingGameId = g.id;
    state.gameForm = { ...emptyGameForm, ...g, screenshots: [...(g.screenshots||[])] };
    render();
    window.scrollTo({ top:0, behavior:"smooth" });
    return;
  }
  if(action === "remove-screenshot"){
    const i = Number(act.dataset.index);
    state.gameForm.screenshots = (state.gameForm.screenshots||[]).filter((_,idx)=>idx!==i);
    render();
    return;
  }
  if(action === "cancel-edit-game"){
    skipFormSync = true;
    state.editingGameId = null;
    state.gameForm = { ...emptyGameForm };
    render();
    return;
  }
  if(action === "toggle-trending"){
    const next = state.games.map(g => g.id===act.dataset.id ? {...g, trending: !g.trending} : g);
    await setJSON(K.games, next); await refresh(); render();
    return;
  }
  if(action === "remove-game"){
    await setJSON(K.games, state.games.filter(g=>g.id!==act.dataset.id));
    if(state.editingGameId===act.dataset.id){ skipFormSync = true; state.editingGameId = null; state.gameForm = { ...emptyGameForm }; }
    await refresh(); render();
    return;
  }
  if(action === "migrate-old-links"){
    const next = state.games.map(g => (!g.linkApk && g.link) ? { ...g, linkApk: normalizeUrl(g.link) } : g);
    const ok = await setJSON(K.games, next);
    if(!ok){ alert("Imeshindwa kurekebisha — angalia mtandao wako kisha jaribu tena."); return; }
    await refresh(); render();
    alert("Imekamilika — game za zamani sasa zina link ya APK.");
    return;
  }

  if(action === "save-ad"){
    const f = state.adForm;
    f.description = document.getElementById("a-desc").value.trim();
    f.link = normalizeUrl(document.getElementById("a-link").value.trim());
    if(!f.image || !f.link){ alert("Weka picha na link ya tangazo."); return; }
    let nextAds;
    if(state.ads.length >= 2){
      const ok = confirm("Tayari kuna matangazo 2 (screen mbili). Ongeza hii itabadilisha ya kwanza. Endelea?");
      if(!ok) return;
      nextAds = [{ id: uid(), ...f }, state.ads[1]].filter(Boolean);
    } else {
      nextAds = [...state.ads, { id: uid(), ...f }];
    }
    const saved = await setJSON(K.ads, nextAds);
    if(!saved){ alert("Imeshindwa kuhifadhi tangazo — angalia mtandao wako kisha jaribu tena (jaribu picha nyepesi zaidi)."); return; }
    state.adForm = { image:"", description:"", link:"" };
    await refresh(); render();
    return;
  }
  if(action === "remove-ad"){
    await setJSON(K.ads, state.ads.filter(a=>a.id!==act.dataset.id)); await refresh(); render();
    return;
  }

  if(action === "decide-market"){
    const next = state.marketplace.map(m => m.id===act.dataset.id ? {...m, status: act.dataset.status} : m);
    await setJSON(K.marketplace, next); await refresh(); render();
    return;
  }
  if(action === "remove-market"){
    await setJSON(K.marketplace, state.marketplace.filter(m=>m.id!==act.dataset.id)); await refresh(); render();
    return;
  }
  if(action === "add-vip-plan"){
    syncVipFormFromDom();
    const f = state.vipForm;
    if(!f.name.trim() || !f.price.trim() || !Number(f.durationDays)){ alert("Weka jina, bei, na muda (siku) wa mpango wa VIP."); return; }
    const next = [...state.vipPlans, { id: uid(), name: f.name.trim(), price: f.price.trim(), durationDays: Number(f.durationDays) }];
    const ok = await setJSON(K.vipPlans, next);
    if(!ok){ alert("Imeshindwa kuhifadhi — angalia mtandao wako kisha jaribu tena."); return; }
    state.vipForm = { name:"", price:"", durationDays:"" };
    await refresh(); render();
    return;
  }
  if(action === "remove-vip-plan"){
    await setJSON(K.vipPlans, state.vipPlans.filter(v=>v.id!==act.dataset.id)); await refresh(); render();
    return;
  }
  if(action === "save-videoad"){
    syncVideoAdFormFromDom();
    const va = { videoUrl: state.videoAd.videoUrl.trim(), watchSeconds: Math.max(3, Number(state.videoAd.watchSeconds)||10), blockAdsCost: Math.max(0, Number(state.videoAd.blockAdsCost)||0) };
    const ok = await setJSON(K.videoAd, va);
    if(!ok){ alert("Imeshindwa kuhifadhi — angalia mtandao wako kisha jaribu tena."); return; }
    state.videoAd = va;
    render();
    alert("Mipangilio ya tangazo imehifadhiwa!");
    return;
  }
  if(action === "add-note"){
    syncNoteFormFromDom();
    const text = state.noteForm.text.trim();
    if(!text) return;
    const next = [...state.adminAdvice, { id: uid(), text, at: Date.now() }];
    const ok = await setJSON(K.adminAdvice, next);
    if(!ok){ alert("Imeshindwa kutuma — angalia mtandao wako kisha jaribu tena."); return; }
    state.noteForm = { text:"" };
    await refresh(); render();
    return;
  }
  if(action === "remove-note"){
    await setJSON(K.adminAdvice, state.adminAdvice.filter(n=>n.id!==act.dataset.id)); await refresh(); render();
    return;
  }

  if(action === "save-settings"){
    const paymentNetwork = document.getElementById("s-network").value.trim();
    const paymentPhone = document.getElementById("s-phone").value.trim();
    await setJSON(K.settings, { paymentNetwork, paymentPhone });
    await refresh(); render();
    return;
  }
  if(action === "decide-payment"){
    const p = state.payments.find(x=>x.id===act.dataset.id);
    const status = act.dataset.status;
    /* approving a VIP purchase grants the plan's days to the user (stacked onto any remaining time) */
    if(p && p.type==="vip" && status==="approved"){
      const users = await getJSON(K.users, []);
      const uIdx = users.findIndex(u=>u.phone===p.userPhone);
      if(uIdx>=0){
        const days = Number(p.vipDurationDays||0);
        const base = Math.max(Date.now(), Number(users[uIdx].vipExpiresAt||0));
        users[uIdx].vipExpiresAt = base + days*24*60*60*1000;
        users[uIdx].vipTier = p.targetName;
        await setJSON(K.users, users);
      }
    }
    const next = state.payments.map(x => x.id===act.dataset.id ? {...x, status} : x);
    await setJSON(K.payments, next); await refresh(); render();
    return;
  }
  if(action === "issue-coin-code"){
    const code = genCode();
    const next = state.payments.map(p => p.id===act.dataset.id ? {...p, status:"code_issued", code} : p);
    await setJSON(K.payments, next); await refresh(); render();
    return;
  }
  if(action === "save-spin-config"){
    syncSpinFormFromDom();
    const missingImage = state.spinConfig.symbols.some(s => !s.image);
    if(missingImage){ alert("Weka picha zote 5 kabla ya kuhifadhi."); return; }
    const cfg = {
      symbols: state.spinConfig.symbols.map(s => ({ id:s.id, image:s.image, level: s.level||"normal", weight: SPIN_LEVEL_WEIGHT[s.level] || 15 })),
      costCoins: Math.max(0, Number(state.spinConfig.costCoins)||0),
    };
    const ok = await setJSON(K.spinConfig, cfg);
    if(!ok){ alert("Imeshindwa kuhifadhi Spin — angalia mtandao wako kisha jaribu tena."); return; }
    state.spinConfig = cfg; // keep the just-saved version locally so the form doesn't need re-fetching
    await refresh(); render();
    alert("Spin imehifadhiwa!");
    return;
  }
  if(action === "add-coin-package"){
    syncPkgFormFromDom();
    const f = state.pkgForm;
    const coins = Number(f.coins);
    if(!coins || !f.price){ alert("Weka idadi ya coins na bei."); return; }
    const next = [...state.coinPackages, { id: uid(), coins, price: f.price.trim(), offer: !!f.offer }];
    const ok = await setJSON(K.coinPackages, next);
    if(!ok){ alert("Imeshindwa kuhifadhi pakiti — angalia mtandao wako kisha jaribu tena."); return; }
    state.pkgForm = { coins:"", price:"", offer:false };
    await refresh(); render();
    return;
  }
  if(action === "remove-coin-package"){
    await setJSON(K.coinPackages, state.coinPackages.filter(p=>p.id!==act.dataset.id));
    await refresh(); render();
    return;
  }
  if(action === "approve-coinpurchase"){
    const p = state.payments.find(x=>x.id===act.dataset.id);
    if(!p) return;
    const creditInput = document.getElementById(`coin-credit-${p.id}`);
    const coinsToCredit = Math.max(0, Number(creditInput ? creditInput.value : p.requestedCoins) || 0);
    if(!coinsToCredit){ alert("Weka idadi sahihi ya coins za kumpa mteja."); return; }
    const users = await getJSON(K.users, []);
    const uIdx = users.findIndex(u=>u.phone===p.userPhone);
    if(uIdx>=0){ users[uIdx].coins = (users[uIdx].coins||0) + coinsToCredit; await setJSON(K.users, users); }
    const nextPayments = state.payments.map(x => x.id===p.id ? { ...x, status:"approved", creditedCoins: coinsToCredit } : x);
    const ok = await setJSON(K.payments, nextPayments);
    if(!ok){ alert("Imeshindwa kuhifadhi — angalia mtandao wako kisha jaribu tena."); return; }
    await refresh(); render();
    return;
  }
  if(action === "reject-coinpurchase"){
    const next = state.payments.map(p => p.id===act.dataset.id ? {...p, status:"rejected"} : p);
    await setJSON(K.payments, next); await refresh(); render();
    return;
  }
});

/* ================= init ================= */
render(); // show the UI immediately with empty data, then hydrate below
if(!STORAGE_OK){
  const warn = document.createElement("div");
  warn.className = "px-4 pt-3 text-[11px] text-amber-300";
  warn.textContent = "⚠️ Bado hujaweka DB_URL yako ya Firebase kwenye code (juu ya <script>). Bila hiyo, taarifa hazitahifadhika wala kuonekana kwenye website.";
  document.getElementById("main").parentElement.insertBefore(warn, document.getElementById("main").parentElement.firstChild);
}
(async function init(){
  await refresh();
  render();
  setInterval(async () => { await refresh(); render(); }, 6000);
})();
</script>
</body>
</html>
