   HII NDIYO SEHEMU MUHIMU: badilisha DB_URL hapa chini na URL ya database yako ya Firebase,
   sawasawa kabisa na ile uliyoweka kwenye faili ya website (lazima ziwe DB_URL ile ile

const DB_URL = "https://mahergamingstore-default-rtdb.firebaseio.com";

function withTimeout(promise, ms){
  return new Promise((resolve) => {
    let done = false;
    const timer = setTimeout(() => { if(!done){ done = true; resolve(null); } }, ms);
    Promise.resolve(promise).then((v) => { if(!done){ done = true; clearTimeout(timer); resolve(v); } })
      .catch(() => { if(!done){ done = true; clearTimeout(timer); resolve(null); } });
  });
}
const STORAGE_OK = !DB_URL.includes("PROJECT-ID");
async function getJSON(key, fallback){
  if(!STORAGE_OK) return fallback;
  try{
    const res = await withTimeout(fetch(`${DB_URL}/${key}.json`), 20000);
    if(!res) return fallback;
    const data = await res.json();
    return (data === null || data === undefined) ? fallback : data;
  }catch{ return fallback; }
}
async function setJSON(key, value){
  if(!STORAGE_OK) return false;
  try{
    const res = await withTimeout(fetch(`${DB_URL}/${key}.json`, { method:"PUT", body: JSON.stringify(value) }), 20000);
    return !!res && res.ok;
  }catch(e){ console.error("storage set failed", e); return false; }
}

const esc = (s) => (s || "").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fileToDataUrl(file, cb){ const reader = new FileReader(); reader.onload = () => cb(reader.result); reader.onerror = () => cb(null); reader.readAsDataURL(file); }
/* compresses/resizes an uploaded image before storing it, so uploads are fast and reliable.
   Small files skip the canvas step entirely (fastest, most reliable path). Bigger files get
   resized; if that ever hangs or fails on a phone, it automatically falls back to the plain
   picture after a few seconds instead of getting stuck forever. */
function compressImage(file, cb, maxDim=900, quality=0.72){
  try{
    if(!file || file.size < 600*1024){ fileToDataUrl(file, cb); return; }
    let settled = false;
    const finish = (result) => { if(settled) return; settled = true; cb(result); };
    const fallbackTimer = setTimeout(() => fileToDataUrl(file, finish), 6000);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        try{
          let { width, height } = img;
          if(width > maxDim || height > maxDim){
            if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
            else { width = Math.round(width * (maxDim/height)); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          clearTimeout(fallbackTimer);
          finish(canvas.toDataURL("image/jpeg", quality));
        }catch{ clearTimeout(fallbackTimer); finish(e.target.result); }
      };
      img.onerror = () => { clearTimeout(fallbackTimer); finish(e.target.result); };
      img.src = e.target.result;
    };
    reader.onerror = () => { clearTimeout(fallbackTimer); fileToDataUrl(file, finish); };
    reader.readAsDataURL(file);
  }catch{ fileToDataUrl(file, cb); }
}

/* ================= focus-preserving render wrapper ================= */
function withFocusPreserved(fn){
  const active = document.activeElement;
  const id = active && active.id;
  const tag = active && active.tagName;
  let selStart, selEnd;
  if(id && (tag === "INPUT" || tag === "TEXTAREA")){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  fn();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if((tag === "INPUT" || tag === "TEXTAREA") && typeof selStart === "number" && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

async function refresh(){
  const [u,g,a,t,s,p,st] = await Promise.all([
    getJSON(K.users, []), getJSON(K.games, []), getJSON(K.ads, []), getJSON(K.tournaments, []),
    getJSON(K.settings, {}), getJSON(K.payments, []), getJSON(K.stats, { visits:0, dailyDownloads:{}, downloadsLog:[] }),
  ]);
  state.users=u; state.games=g; state.ads=a; state.tournaments=t; state.settings=s; state.payments=p; state.stats=st;
}

function badge(text, tone){
  const tones = { cyan:"bg-cyan-400/10 text-cyan-300 border-cyan-400/30", violet:"bg-violet-400/10 text-violet-300 border-violet-400/30",

  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold border ${tones[tone]}">${text}</span>`;
}

/* ================= overview ================= */

  </div>`;
}

function renderOverview(){

  const freeDownloads = (state.stats.downloadsLog||[]).filter(d=>d.type==="free").length;
  const days = Object.entries(state.stats.dailyDownloads||{}).sort((a,b)=> a[0]<b[0] ? 1 : -1).slice(0,7);
  const trendingGames = state.games.filter(g=>g.trending);

  return `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    ${statCard("👁","Watu waliotembelea", state.stats.visits||0, "cyan")}
    ${statCard("➕","Akaunti zilizofunguliwa", state.users.length, "violet")}
    ${statCard("🛒","Game zilizonunuliwa", purchases, "amber")}
    ${statCard("⬇","Download za Bure", freeDownloads, "emerald")}
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4">
      <p class="text-xs font-bold text-slate-400 mb-3">Downloads za Leo (${today})</p>
      <p class="text-4xl font-extrabold text-emerald-400">${todayDownloads}</p>
      <p class="text-[11px] text-slate-500 mt-1">Jumla ya downloads zote: ${totalDownloads}</p>
      <div class="mt-4 space-y-1">
        ${days.map(([d,c])=>`<div class="flex items-center justify-between text-[11px] text-slate-400"><span>${d}</span><span class="font-bold text-slate-200">${c}</span></div>`).join("") || `<p class="text-slate-600 text-xs">Bado hakuna data.</p>`}
      </div>
    </div>
    <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4">
      <div class="flex items-center gap-2 mb-3"><span class="text-rose-400">🔥</span><p class="text-xs font-bold text-slate-400">Game Zinazo-Trend</p></div>
      <div class="space-y-2 max-h-52 overflow-y-auto">
        ${trendingGames.length===0 ? `<p class="text-slate-600 text-xs">Hakuna game za trending bado.</p>` :
          trendingGames.map(g=>`<div class="flex items-center gap-2 bg-slate-950/60 rounded-lg p-2">${g.image?`<img src="${g.image}" class="w-8 h-8 rounded object-cover"/>`:""}<span class="text-xs font-semibold truncate">${esc(g.title)}</span></div>`).join("")}
      </div>
    </div>

}

        <input id="a-link" value="${esc(f.link)}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm" placeholder="https://..." /></label>
      <button data-action="save-ad" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-lg">Hifadhi Tangazo</button>
      <p class="text-[11px] text-slate-500 mt-2">Kumbuka: website inaonesha screen mbili tu za matangazo kwa wakati mmoja.</p>
    </div>
    <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4">
      <h3 class="font-bold mb-3">Matangazo Yaliyopo</h3>
      <div class="space-y-3">
        ${state.ads.map((a,i)=>`
          <div class="flex items-center gap-3 bg-slate-950/60 rounded-lg p-2">
            <img src="${a.image}" class="w-14 h-10 rounded object-cover"/>

/* ================= payments panel ================= */
function renderPayments(){
  const cash = state.payments.filter(p=>p.type==="game" || p.type==="tournament");
  const coinReqs = state.payments.filter(p=>p.type==="coin");
  const pending = cash.filter(p=>p.status==="pending");
  const decided = cash.filter(p=>p.status!=="pending").slice().reverse();
  const coinPending = coinReqs.filter(p=>p.status==="pending");
  const coinIssued = coinReqs.filter(p=>p.status==="code_issued");
  const coinDone = coinReqs.filter(p=>p.status==="approved" || p.status==="rejected").slice().reverse();

  return `
  <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 mb-5">
    <h3 class="font-bold mb-3">💳 Namba za Malipo (zinaonekana kwa wateja)</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <label class="block mb-3"><span class="block text-xs font-semibold text-slate-400 mb-1">Jina la Mtandao (M-Pesa, Tigo Pesa, Airtel Money...)</span>
        <input id="s-network" value="${esc(state.settings.paymentNetwork||"")}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm" /></label>
      <label class="block mb-3"><span class="block text-xs font-semibold text-slate-400 mb-1">Namba ya Simu ya Malipo</span>
        <input id="s-phone" value="${esc(state.settings.paymentPhone||"")}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm" /></label>
    </div>
    <button data-action="save-settings" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm">Hifadhi</button>
  </div>

  <h3 class="font-bold mb-3">⏱ Malipo ya Pesa Yanayosubiri Idhini (${pending.length})</h3>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
    ${pending.map(p=>`
      <div class="bg-slate-900/70 border border-amber-500/30 rounded-xl p-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold">${p.type==="game"?"🎮 Game":"🏆 Tournament"}: ${esc(p.targetName)}</span>
          <span class="text-[10px] text-slate-500">${new Date(p.submittedAt).toLocaleString()}</span>
        </div>
        <p class="text-[11px] text-slate-400">Mteja: ${esc(p.username)} (${esc(p.userPhone)})</p>
        <p class="text-[11px] text-slate-400 mb-2">Alilipia kwa namba: <span class="font-mono text-slate-200">${esc(p.payerPhone)}</span></p>
        <img src="${p.screenshot}" class="w-full rounded-lg border border-slate-800 mb-2 max-h-52 object-contain bg-slate-950"/>
        <div class="flex gap-2">
          <button data-action="decide-payment" data-id="${p.id}" data-status="approved" class="flex-1 bg-emerald-500 text-slate-950 font-bold text-xs py-2 rounded-lg">✅ Ruhusu</button>
          <button data-action="decide-payment" data-id="${p.id}" data-status="rejected" class="flex-1 bg-rose-500/80 text-slate-950 font-bold text-xs py-2 rounded-lg">✖ Kataa</button>
        </div>
      </div>`).join("") || `<p class="text-slate-600 text-xs">Hakuna malipo ya pesa yanayosubiri kwa sasa.</p>`}
  </div>

  <h3 class="font-bold mb-3">🪙 Maombi ya Kufungua kwa Coins (${coinPending.length})</h3>
  <p class="text-[11px] text-slate-500 mb-3">Mteja ana coins za kutosha lakini hana pesa. Mtolee code, kisha mwambie aiweke kwenye website yake (simu/SMS).</p>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
    ${coinPending.map(p=>`
      <div class="bg-slate-900/70 border border-amber-500/30 rounded-xl p-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold">🎮 ${esc(p.targetName)}</span>
          <span class="text-[10px] text-slate-500">${new Date(p.submittedAt).toLocaleString()}</span>
        </div>
        <p class="text-[11px] text-slate-400">Mteja: ${esc(p.username)} (${esc(p.userPhone)})</p>
        <p class="text-[11px] text-slate-400 mb-3">Coins zinazohitajika: <span class="text-amber-300 font-bold">🪙 ${esc(p.coinCost)}</span></p>
        <div class="flex gap-2">
          <button data-action="issue-coin-code" data-id="${p.id}" class="flex-1 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs py-2 rounded-lg">🔑 Toa Code</button>
          <button data-action="decide-payment" data-id="${p.id}" data-status="rejected" class="flex-1 bg-rose-500/80 text-slate-950 font-bold text-xs py-2 rounded-lg">✖ Kataa</button>
        </div>
      </div>`).join("") || `<p class="text-slate-600 text-xs">Hakuna maombi mapya ya coins.</p>`}
  </div>

  ${coinIssued.length > 0 ? `
  <h3 class="font-bold mb-3 text-slate-400 text-sm">Code Zilizotolewa (zinasubiri mteja aweke)</h3>
  <div class="space-y-2 mb-6">
    ${coinIssued.map(p=>`
      <div class="flex items-center justify-between bg-slate-950/60 rounded-lg p-2 text-xs">
        <span>${esc(p.targetName)} — ${esc(p.username)} (${esc(p.userPhone)})</span>
        <span class="font-mono font-bold text-violet-300 tracking-widest">${esc(p.code)}</span>
      </div>`).join("")}
  </div>` : ""}

  <h3 class="font-bold mb-3 text-slate-400 text-sm">Historia ya Malipo ya Pesa</h3>
  <div class="space-y-2 mb-6">
    ${decided.map(p=>`
      <div class="flex items-center justify-between bg-slate-950/60 rounded-lg p-2 text-xs">
        <span>${esc(p.targetName)} — ${esc(p.username)}</span>
        <span class="${p.status==="approved" ? "text-emerald-400" : "text-rose-400"} font-bold">${p.status==="approved" ? "Imeruhusiwa" : "Imekataliwa"}</span>
      </div>`).join("") || `<p class="text-slate-600 text-xs">Bado hakuna historia.</p>`}
  </div>

  <h3 class="font-bold mb-3 text-slate-400 text-sm">Historia ya Coins</h3>
  <div class="space-y-2">
    ${coinDone.map(p=>`
      <div class="flex items-center justify-between bg-slate-950/60 rounded-lg p-2 text-xs">
        <span>${esc(p.targetName)} — ${esc(p.username)}</span>
        <span class="${p.status==="approved" ? "text-emerald-400" : "text-rose-400"} font-bold">${p.status==="approved" ? "Imefunguliwa (redeemed)" : "Imekataliwa"}</span>
      </div>`).join("") || `<p class="text-slate-600 text-xs">Bado hakuna historia.</p>`}
  </div>`;
}

/* ================= users panel ================= */
function renderUsers(){
  return `
  <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4">
    <h3 class="font-bold mb-3">👥 Watumiaji Waliojisajili (${state.users.length})</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-xs">
        <thead><tr class="text-slate-500 text-left border-b border-slate-800">
          <th class="py-2 pr-3">Jina</th><th class="py-2 pr-3">Simu</th><th class="py-2 pr-3">Gmail</th><th class="py-2 pr-3">Coins</th><th class="py-2">Tarehe</th>
        </tr></thead>
        <tbody>
          ${state.users.map(u=>`
            <tr class="border-b border-slate-900">
              <td class="py-2 pr-3 font-semibold">${esc(u.username)}</td>
              <td class="py-2 pr-3 font-mono">${esc(u.phone)}</td>
              <td class="py-2 pr-3 text-slate-400">${esc(u.gmail)}</td>
              <td class="py-2 pr-3 text-amber-300 font-bold">${u.coins||0}</td>
              <td class="py-2 text-slate-500">${new Date(u.createdAt).toLocaleDateString()}</td>
            </tr>`).join("") || `<tr><td colspan="5" class="text-slate-600 text-xs pt-2">Bado hakuna aliyejisajili.</td></tr>`}

/* ================= render root ================= */
function _render(){
  syncAllForms();
  renderNav();
  const main = document.getElementById("main");
  if(state.tab==="overview") main.innerHTML = renderOverview();
  else if(state.tab==="games") main.innerHTML = renderGames();
  else if(state.tab==="ads") main.innerHTML = renderAds();
  else if(state.tab==="tournament") main.innerHTML = renderTournamentPanel();
  else if(state.tab==="payments") main.innerHTML = renderPayments();
  else if(state.tab==="users") main.innerHTML = renderUsers();
}
function render(){ withFocusPreserved(_render); }

/* ================= file input handling ================= */
document.addEventListener("change", (e) => {
  if(e.target.id === "g-image" && e.target.files[0]){ document.getElementById("g-image-label").textContent = "Inasindika picha..."; compressImage(e.target.files[0], d => { state.gameForm.image = d; document.getElementById("g-image-label").textContent = "Picha imewekwa ✔"; }); }
  if(e.target.id === "g-emu-image" && e.target.files[0]){ document.getElementById("g-emu-image-label").textContent = "Inasindika picha..."; compressImage(e.target.files[0], d => { state.gameForm.emulatorImage = d; document.getElementById("g-emu-image-label").textContent = "Picha imewekwa ✔"; }); }
  if(e.target.id === "a-image" && e.target.files[0]){ document.getElementById("a-image-label").textContent = "Inasindika picha..."; compressImage(e.target.files[0], d => { state.adForm.image = d; document.getElementById("a-image-label").textContent = "Picha imewekwa ✔"; }); }
  if(e.target.id === "g-needs-emu"){ render(); }
});

/* ================= global click handling ================= */
document.addEventListener("click", async (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ state.tab = tabBtn.dataset.tab; render(); return; }

  const act = e.target.closest("[data-action]");
  if(!act) return;
  const action = act.dataset.action;

  if(action === "save-game"){
    const f = state.gameForm;
    f.title = document.getElementById("g-title").value.trim();
    f.category = document.getElementById("g-category").value;
    f.genre = document.getElementById("g-genre").value;
    f.coinCost = document.getElementById("g-coincost").value.trim();
    f.price = document.getElementById("g-price").value.trim();
    f.linkApk = document.getElementById("g-link-apk").value.trim();
    f.linkObb = document.getElementById("g-link-obb").value.trim();
    f.linkData = document.getElementById("g-link-data").value.trim();
    f.platform = document.getElementById("g-platform").value;
    f.needsEmulator = document.getElementById("g-needs-emu").checked;
    if(f.needsEmulator){
      f.emulatorLink = document.getElementById("g-emu-link").value.trim();
      f.firmwareLink = document.getElementById("g-firmware-link").value.trim();
      f.prodKeysLink = document.getElementById("g-prodkeys-link").value.trim();
    }
    f.trending = document.getElementById("g-trending").checked;
    if(!f.title || !f.linkApk){ alert("Weka jina la game na link ya APK ya game."); return; }
    const ok = await setJSON(K.games, [...state.games, { id: uid(), ...f }]);
    if(!ok){ alert("Imeshindwa kuhifadhi game — angalia mtandao wako kisha jaribu tena."); return; }
    state.gameForm = { ...emptyGameForm };
    await refresh(); render();
    return;
  }
  if(action === "toggle-trending"){
    const next = state.games.map(g => g.id===act.dataset.id ? {...g, trending: !g.trending} : g);
    await setJSON(K.games, next); await refresh(); render();
    return;
  }
  if(action === "remove-game"){
    await setJSON(K.games, state.games.filter(g=>g.id!==act.dataset.id)); await refresh(); render();
    return;
  }

  if(action === "save-ad"){
    const f = state.adForm;
    f.description = document.getElementById("a-desc").value.trim();
    f.link = document.getElementById("a-link").value.trim();
    if(!f.image || !f.link){ alert("Weka picha na link ya tangazo."); return; }
    let nextAds;
    if(state.ads.length >= 2){
      const ok = confirm("Tayari kuna matangazo 2 (screen mbili). Ongeza hii itabadilisha ya kwanza. Endelea?");
      if(!ok) return;
      nextAds = [{ id: uid(), ...f }, state.ads[1]].filter(Boolean);
    } else {
      nextAds = [...state.ads, { id: uid(), ...f }];
    }
    const saved = await setJSON(K.ads, nextAds);
    if(!saved){ alert("Imeshindwa kuhifadhi tangazo — angalia mtandao wako kisha jaribu tena (jaribu picha nyepesi zaidi)."); return; }
    state.adForm = { image:"", description:"", link:"" };
    await refresh(); render();
    return;
  }
  if(action === "remove-ad"){
    await setJSON(K.ads, state.ads.filter(a=>a.id!==act.dataset.id)); await refresh(); render();
    return;
  }

  if(action === "save-tournament"){
    const f = state.tourForm;
    f.name = document.getElementById("t-name").value.trim();
    f.type = document.getElementById("t-type").value;
    f.fee = document.getElementById("t-fee").value.trim();
    f.description = document.getElementById("t-desc").value.trim();
    if(!f.name || !f.fee){ alert("Weka jina na ada ya tournament."); return; }
    const ok = await setJSON(K.tournaments, [...state.tournaments, { id: uid(), ...f }]);
    if(!ok){ alert("Imeshindwa kuhifadhi tournament — angalia mtandao wako kisha jaribu tena."); return; }
    state.tourForm = { name:"", type:"league", fee:"", description:"" };
    await refresh(); render();
    return;
  }
  if(action === "remove-tournament"){
    await setJSON(K.tournaments, state.tournaments.filter(t=>t.id!==act.dataset.id)); await refresh(); render();
    return;
  }

  if(action === "save-settings"){
    const paymentNetwork = document.getElementById("s-network").value.trim();
    const paymentPhone = document.getElementById("s-phone").value.trim();
    await setJSON(K.settings, { paymentNetwork, paymentPhone });
    await refresh(); render();
    return;
  }
  if(action === "decide-payment"){
    const next = state.payments.map(p => p.id===act.dataset.id ? {...p, status: act.dataset.status} : p);
    await setJSON(K.payments, next); await refresh(); render();
    return;
  }
  if(action === "issue-coin-code"){
    const code = genCode();
    const next = state.payments.map(p => p.id===act.dataset.id ? {...p, status:"code_issued", code} : p);
    await setJSON(K.payments, next); await refresh(); render();
    return;
  }
});

/* ================= init ================= */
render(); // show the UI immediately with empty data, then hydrate below
if(!STORAGE_OK){
  const warn = document.createElement("div");
  warn.className = "px-4 pt-3 text-[11px] text-amber-300";
  warn.textContent = "⚠️ Bado hujaweka DB_URL yako ya Firebase kwenye code (juu ya <script>). Bila hiyo, taarifa hazitahifadhika wala kuonekana kwenye website.";
  document.getElementById("main").parentElement.insertBefore(warn, document.getElementById("main").parentElement.firstChild);
}
(async function init(){
  await refresh();
  render();
  setInterval(async () => { await refresh(); render(); }, 6000);
})();
</script>
</body>
